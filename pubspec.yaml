name: innocent
description: Innocent - a personal Flutter media player
publish_to: 'none'
version: 1.64.26+339

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned to 0.20.2 by flutter_localizations in the SDK; using
  # the same constraint avoids the pub-solver conflict.
  intl: ^0.20.2

  # === PLAYER ===
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  # === STATE / ROUTING ===
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # === FILE / MEDIA ===
  photo_manager: ^3.0.0
  file_picker: ^8.0.0+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # === PERMISSIONS ===
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0

  # === SYSTEM ===
  wakelock_plus: ^1.2.5
  screen_brightness: ^0.2.2+1
  flutter_volume_controller: ^1.3.2

  # === PHASE 3 NEW ===
  shared_preferences: ^2.2.3

  # === UI ===
  cupertino_icons: ^1.0.6
  # Audit fix (build blocker): share_plus ^9.0.0 pins mime ^1, but
  # audio_metadata_reader ^1.4.1 needs mime ^2 -> pub solver failed.
  # share_plus 10.0.3+ drops the mime ^1 pin (resolves the conflict)
  # while the deprecated-but-still-working Share.share(text, subject:)
  # API stays available across the 10.x line -> no call-site changes.
  # Staying <11.0.0 avoids the SharePlus.instance API migration and the
  # newer Gradle/AGP requirements of 11/12.
  share_plus: ^10.0.3
  crypto: ^3.0.3
  # Crash reporting, OFF unless a DSN is compiled in with
  # `--dart-define=SENTRY_DSN=…`. With no DSN the SDK is never initialised, so
  # a build made the way CI makes one is unchanged by it. Needs Flutter
  # >=3.24.0 and Dart >=3.5.0; this project is eight minors past both, so it
  # required no SDK move. See lib/core/services/diagnostics/sentry_reporting.dart
  # and docs/crash_reporting.md.
  sentry_flutter: ^9.30.0
  # Audit fix (standard high-quality): http for the manual-URL
  # subtitle download feature in video_option_menu. Lightweight,
  # Dart-first, official Flutter team package.
  http: ^1.2.1
  # Audit fix (standard high-quality): biometric authentication for
  # Private Folder PIN unlock. Provides fingerprint/face fallback so
  # daily users don't have to retype the PIN on every re-entry while
  # keeping the PIN as the underlying source of truth (biometric is
  # an unlock affordance, not the secret itself).
  local_auth: ^2.2.0
  # Audit fix (PIN at rest): keystore-backed storage for the Private
  # Folder PIN hash / salt / lockout. On Android this is AES-encrypted via
  # the OS keystore (EncryptedSharedPreferences), so a root / ADB
  # filesystem dump can't recover the salted hash to brute-force the PIN
  # offline. Pure-Dart API; the encryption is handled by platform code.
  flutter_secure_storage: ^9.2.2
  # Audit fix (Transfer real impl): tiny pure-Dart HTTP server used
  # by the "Send" mode to serve picked files to other devices on the
  # same Wi-Fi network. Same library Flutter team uses in official
  # examples. Pure Dart → no platform code, works on Android out of
  # the box.
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  # QR code rendering for sharing the server URL with the receiving
  # device. Pure Dart.
  qr_flutter: ^4.1.0
  # QR scanning on the Transfer "Receive" side (scan the sender's QR to get
  # its share URL instead of typing it). MLKit-backed; needs the CAMERA
  # permission (declared in AndroidManifest).
  mobile_scanner: ^5.2.3
  # Local network interface enumeration — needed to find the right
  # IPv4 address to advertise (Wi-Fi NIC, not loopback).
  network_info_plus: ^5.0.3
  # Audit fix (Music: ID3 tags not read → empty artist/album fields):
  # audio_metadata_reader is pure Dart, supports MP3 / MP4 / FLAC /
  # OGG / Vorbis tag formats.
  audio_metadata_reader: ^1.4.1
  # Audit fix (Music: background play + lock-screen + notification
  # controls + Bluetooth headset support): audio_service wraps the
  # OS-level MediaSession on Android and Now-Playing on iOS.
  audio_service: ^0.18.13

  # === ACCOUNT / AUTH ===
  # Native Google sign-in, which is the only sign-in this app can offer for
  # free. Phone OTP needs a paid SMS provider and email needs a paid-or-free
  # SMTP service; a Google account costs nothing per sign-in, forever, and
  # every Android phone already has one signed in.
  #
  # 7.x AND NOT 6.x, deliberately. The 7 line replaced the whole API
  # (`GoogleSignIn.instance.initialize()` + `authenticate()` instead of
  # `GoogleSignIn(...)` + `signIn()`), and 6.x is the line that will stop
  # getting fixes. 7.2.0 needs Flutter >=3.29.0; CI pins 3.32.8, three minors
  # past it, so this required no SDK move — unlike share_plus 11, which is
  # held back above for exactly the opposite reason.
  #
  # In 7.x `GoogleSignInAuthentication` carries ONLY an idToken, no access
  # token. That is all that is needed here: the token is exchanged at
  # `/auth/v1/token?grant_type=id_token`, where `access_token` is optional for
  # Google. See api_account_repository.dart.
  #
  # What this actually resolves to, because the caret hides it: the Flutter
  # 3.32.8 pin holds `google_sign_in_android` at 7.2.1, since 7.2.2+ requires
  # Flutter >=3.35.0. That matters for the Java target — see the note in
  # android/app/build.gradle.kts.
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Test-only, and both are already in the tree as transitive dependencies of
  # path_provider — declared here rather than imported implicitly so the
  # analyzer's `depend_on_referenced_packages` has nothing to say and so a
  # future version bump of path_provider cannot silently remove them.
  #
  # What they are for: test/offline_library_test.dart points
  # getApplicationSupportDirectory at a temp folder. The offline shelf's whole
  # behaviour IS its filesystem interaction — an index that agrees with a mock
  # would prove nothing — so the test writes real files and needs to choose
  # where.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true
