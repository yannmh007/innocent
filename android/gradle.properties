## Phase 33: Tuned for FlutLab.io / low-memory CI containers.
## The previous -Xmx8G crashed the daemon ("Daemon disappeared") because
## FlutLab's container has only ~4 GB RAM total. media_kit links libmpv (~80MB
## per ABI) so we still need a generous heap, but it must fit the container.
## 2.5 GB heap + 512 MB metaspace works well for media_kit-based projects.
## v0.72.1: trimmed 2560M -> 2048M. The Gradle heap is not the only JVM in the
## ~4 GB container: the Kotlin compiler used to fork its OWN daemon JVM (another
## ~700 MB) that stacks on top. As the native/Kotlin source grew (MainActivity +
## AdbManager), the two heaps together crept past the container limit and the
## build daemon was OOM-killed mid-build ("daemon disappeared"). Smaller Gradle
## heap + running Kotlin in-process (below) keeps total memory under the cap.
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

## Run with a single worker — parallel + media_kit + low RAM = OOM.
org.gradle.workers.max=1
org.gradle.parallel=false
## Disable the daemon entirely on FlutLab so each invocation is isolated and
## the container reclaims memory between phases (configure/compile/dex/package).
org.gradle.daemon=false
## Skip configure-on-demand — saves a bit of memory at the cost of ~5s.
org.gradle.configureondemand=false

## v0.72.1 OOM fix: run the Kotlin compiler IN-PROCESS instead of forking a
## separate compile-daemon JVM. On a low-RAM container a second JVM heap
## stacking on the Gradle heap is what pushes total memory over the edge; in
## process there is a single heap to bound. Also cap the fallback daemon heap.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024M -XX:MaxMetaspaceSize=320m
## Incremental Kotlin/Java keep caches in memory across modules — off is leaner
## and more deterministic on an ephemeral one-shot container.
kotlin.incremental=false
## Don't keep the file-system-watch tree in memory on a throwaway container.
org.gradle.vfs.watch=false
org.gradle.caching=false

android.useAndroidX=true
android.enableJetifier=true

## Phase 33: Build only ARM64 .so files by default. Phone-emulators and
## modern devices are all arm64-v8a — this drops APK size from ~120 MB to
## ~45 MB and cuts memory peak by ~70% during native packaging.
## To build a universal APK, override via:  flutter build apk --release
## (Flutter ignores this when explicit target ABIs are passed.)
