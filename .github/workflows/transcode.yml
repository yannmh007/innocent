# Turn uploaded masters into ladders anybody can stream.
#
# WHAT THIS IS FOR. The operator uploads whatever their camera made — 4K, 60
# frames a second, sixty megabits — and a viewer on a mobile connection
# cannot receive that continuously. No player setting fixes it; that is
# arithmetic, not a setting. A smaller copy of the same video does fix it,
# and this is where those get made.
#
# WHY A RUNNER, AND WHY THIS ONE. The operator works from a phone. There is
# no server in this project, and adding one means a bill, a machine to patch
# and a key to lose. GitHub Actions on standard runners is free and unmetered
# for public repositories, which this is, and a runner is four x86 cores with
# ffmpeg one apt-get away. It is the only free compute this project already
# has a relationship with.
#
# WHY IT PULLS RATHER THAN BEING PUSHED. Pushing means a GitHub token with
# write access to this repository living in Supabase. Pulling means one
# shared secret whose entire power is "ask for a transcode job" — a much
# smaller thing to lose. The cost is that a job starts within five minutes
# instead of instantly, which is nothing beside the hour of encoding after
# it.
#
# WHY IT HOLDS NO BUCKET CREDENTIALS. Everything it touches arrives as a
# PRESIGNED URL: one GET for the master, one PUT per rung, each scoped to a
# single object and expiring the same day. This repository is public; R2
# account keys stored here would be one careless `echo` from being permanent.
name: Transcode

on:
  # The fallback, not the way in. Measured on 2026-10-05/06 this fired five
  # times in a day; four videos queued at 16:30 waited hours for streaming
  # copies. The transcode function now starts this workflow itself when a
  # video is queued (workflow_dispatch, GH_DISPATCH_TOKEN), and a run that
  # did a ladder starts the next one in case more are waiting.
  schedule:
    - cron: '*/5 * * * *'
  # For starting one immediately rather than waiting for the tick.
  workflow_dispatch:

# One ladder at a time. Two runners encoding two different files would be
# fine; two runners encoding the SAME file would race to write the same
# objects, and the claim in the database is what prevents that. This is the
# belt to its braces.
concurrency:
  group: transcode
  cancel-in-progress: false

jobs:
  ladder:
    runs-on: ubuntu-latest
    # Under GitHub's own six-hour ceiling, with room left to report the rungs
    # that did finish. The script reports after EVERY rung for exactly this
    # reason: a job killed at the limit still leaves a watchable video.
    timeout-minutes: 330
    permissions:
      contents: read
      # Only to start the next run of this workflow after a ladder, and
      # Trick-play for its seek-bar pictures (both below).
      actions: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # ASK FIRST, INSTALL SECOND. The common case by far is "nothing to do"
      # — this ticks every five minutes whether or not anyone uploaded — and
      # spending thirty seconds of apt on that is a waste of somebody's
      # shared runners.
      - name: Ask for work
        id: claim
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          RUNNER_SECRET: ${{ secrets.TRANSCODE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SB_URL:-}" ] || [ -z "${RUNNER_SECRET:-}" ]; then
            echo "TRANSCODE_SECRET or SUPABASE_URL not set — nothing to do."
            echo "job=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A RUNNER SAYS WHETHER IT SEALS (migration 070): only one whose
          # Python opens the media seal (tool/media_seal.py) is handed a
          # sealed master, or a film the switch wants sealed.
          seals=0
          if python3 -c "import sys; sys.path.insert(0, 'tool'); import media_seal" >/dev/null 2>&1; then seals=1; fi
          echo "seals=$seals" >> "$GITHUB_OUTPUT"
          code=$(curl -sS -o /tmp/job.json -w '%{http_code}' \
            -X POST "$SB_URL/functions/v1/transcode" \
            -H "Authorization: Bearer $RUNNER_SECRET" \
            -H 'Content-Type: application/json' \
            -d "{\"op\":\"claim\",\"seals\":$seals}")
          if [ "$code" != "200" ]; then
            echo "claim returned $code"; echo "job=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The payload is never printed. It is a bundle of presigned URLs,
          # and a run log on a public repository is public.
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/job.json')).get('asset_id') else 1)"; then
            echo "job=yes" >> "$GITHUB_OUTPUT"
            python3 -c "import json;print('asset', json.load(open('/tmp/job.json'))['asset_id'])"
          else
            echo "queue is empty"
            echo "job=none" >> "$GITHUB_OUTPUT"
          fi

      # ── ten stills per video for the cover picker (migration 043) ────────
      #
      # A batch of up to twenty, every run, before the ladder: frames take
      # seconds a video and the console is waiting on them; a ladder can take
      # an hour. Asked separately from the ladder, so a run with no ladder to
      # build still makes the frames.
      - name: Ask for frames
        id: frames
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          RUNNER_SECRET: ${{ secrets.TRANSCODE_SECRET }}
        run: |
          if [ -z "${SB_URL:-}" ] || [ -z "${RUNNER_SECRET:-}" ]; then
            echo "frames=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(curl -sS -o /tmp/frames.json -w '%{http_code}' \
            -X POST "$SB_URL/functions/v1/transcode" \
            -H "Authorization: Bearer $RUNNER_SECRET" \
            -H 'Content-Type: application/json' \
            -d "{\"op\":\"frames_claim\",\"seals\":${{ steps.claim.outputs.seals || 0 }}}" || echo 000)
          n=$(python3 -c "import json;print(len(json.load(open('/tmp/frames.json')).get('jobs') or []))" 2>/dev/null || echo 0)
          echo "frames: HTTP $code, $n video(s)"
          if [ "$code" = "200" ] && [ "$n" -gt 0 ]; then
            echo "frames=yes" >> "$GITHUB_OUTPUT"
          else
            echo "frames=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ffmpeg
        if: steps.claim.outputs.job == 'yes' || steps.frames.outputs.frames == 'yes'
        # A STATIC BUILD FROM A GITHUB RELEASE, NOT apt. On 2026-10-06 the
        # apt route took thirteen minutes (mirror and dependency resolution)
        # before a single frame was encoded — thirteen minutes added to every
        # film's wait for its streaming copies. The BtbN build is one archive
        # from GitHub's own storage, seconds away, and carries zscale (zimg)
        # for the HDR tone-mapping. apt stays as the fallback.
        env:
          # A dated BtbN build of the 7.1 line, checked by SHA-256 before it
          # is unpacked; never the floating `latest`, which BtbN replaces
          # every day. Renew with `python3 tool/pins.py ffmpeg` (the same
          # three values in transcode.yml and device-lab.yml; the dependency
          # scan's `pins` job checks every week that the file is still there).
          FFMPEG_TAG: 'autobuild-2026-07-31-14-10'
          FFMPEG_ASSET: 'ffmpeg-n7.1.5-12-g1fdbca85aa-linux64-gpl-7.1.tar.xz'
          FFMPEG_SHA256: 'c1e6caf48923dd8e6bc5e54d51ba70c321175b8162ae9c414c392990e72f0e79'
        run: |
          set -u
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$FFMPEG_ASSET"
          if curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz "$url" \
             && echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c --quiet - \
             && mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1 \
             && /tmp/ffmpeg/bin/ffmpeg -version >/dev/null 2>&1; then
            echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
            /tmp/ffmpeg/bin/ffmpeg -version | head -1
          else
            # Slower (the 2026-10-06 thirteen minutes) but signed by Ubuntu;
            # never an unchecked file in a job that holds TRANSCODE_SECRET.
            echo "::warning::the pinned ffmpeg build is gone or is not the pinned file: Ubuntu's ffmpeg instead (slower). Renew the pin: python3 tool/pins.py ffmpeg"
            echo "static build unavailable - falling back to apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            ffmpeg -version | head -1
          fi

      - name: Make the frames
        if: steps.frames.outputs.frames == 'yes'
        env:
          JOB_TOKEN: ${{ secrets.TRANSCODE_SECRET }}
        run: python3 tool/frames.py

      - name: Build the ladder
        if: steps.claim.outputs.job == 'yes'
        env:
          JOB_TOKEN: ${{ secrets.TRANSCODE_SECRET }}
        run: |
          set -euo pipefail
          export ASSET_ID="$(python3 -c "import json;print(json.load(open('/tmp/job.json'))['asset_id'])")"
          export SRC_URL="$(python3 -c "import json;print(json.load(open('/tmp/job.json'))['src_url'])")"
          export DONE_URL="$(python3 -c "import json;print(json.load(open('/tmp/job.json'))['done_url'])")"
          export PUT_BASE="$(python3 -c "import json;print(json.dumps(json.load(open('/tmp/job.json'))['put']))")"
          # The media seal's part of the job (docs/MEDIA_ENCRYPTION.md §7):
          # read from the file by tool/transcode_seal.py, never printed.
          export JOB_FILE=/tmp/job.json
          # What the script prints is kept on the runner as well, for the
          # step that starts the seek bar's pictures (below). The log shows
          # the same lines: no address, no key.
          bash tool/transcode.sh | tee /tmp/ladder.log

      - name: Say so when it did not work
        if: failure() && steps.claim.outputs.job == 'yes'
        env:
          JOB_TOKEN: ${{ secrets.TRANSCODE_SECRET }}
        run: |
          # A failure that exists only in a run log is a file stuck on
          # "running" in the console forever. The operator finds out here.
          python3 - > /tmp/fail.json <<'PY'
          import json, os
          job = json.load(open('/tmp/job.json'))
          print(json.dumps({
            'op': 'done',
            'token': os.environ['JOB_TOKEN'],
            'asset_id': job['asset_id'],
            'rows': None,
            'note': 'encoder failed - see the Transcode run in Actions',
          }))
          PY
          curl -fsS -X POST "$(python3 -c "import json;print(json.load(open('/tmp/job.json'))['done_url'])")" \
            -H 'Content-Type: application/json' -d @/tmp/fail.json || true

      # THE SEEK BAR'S PICTURES FOLLOW THE LADDER (the owner's word of 21 Nov
      # 2026). A new ladder used to wait for Trick-play's daily schedule —
      # up to a day of a seek bar without its pictures. A run on main that
      # recorded a rung starts Trick-play on main now. That job claims every
      # film whose pack is missing or stale (claim_trickplay: made from a
      # smallest rung of other bytes), so one start serves several ladders;
      # its concurrency queues a start behind a running one and never
      # cancels it, and the daily schedule stays as the net. Main only: a
      # branch run is a test, and Trick-play's scope is main's.
      #
      # Counted from what tool/transcode.sh printed: a rung is a line
      # `NNNp -> N MB, N kbps`, and after it every report (one a rung, one
      # at the end, the `ladder:` line follows that) carries every rung so
      # far. So a rung, and fewer `report failed` lines than reports after
      # it, means the database has a rung from this run.
      - name: Start the seek bar's pictures
        if: always() && steps.claim.outputs.job == 'yes' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          log=/tmp/ladder.log
          rungs=$(grep -cE '^[0-9]+p -> [0-9]+ MB, [0-9]+ kbps$' "$log" 2>/dev/null || true)
          failed=$(grep -c '^report failed' "$log" 2>/dev/null || true)
          finished=$(grep -c '^ladder:$' "$log" 2>/dev/null || true)
          rungs=${rungs:-0}; failed=${failed:-0}; finished=${finished:-0}
          reports=$(( rungs + finished ))
          if [ "$rungs" -gt 0 ] && [ "$failed" -lt "$reports" ]; then
            if gh workflow run trickplay.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "trick-play requested: $rungs rung(s) recorded" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "could not request trick-play (its daily schedule will make the pack)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "no rung recorded by this run: no trick-play ($rungs rung(s), $failed of $reports report(s) failed)"
          fi

      # ONE LADDER PER RUN, SO ASK FOR THE NEXT RUN NOW. Two videos queued
      # together used to be one ladder now and one whenever the schedule next
      # fired. If nothing else is waiting, that next run claims nothing and
      # ends in seconds.
      - name: Start the next run
        if: always() && steps.claim.outputs.job == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          gh workflow run transcode.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" \
            && echo "next run requested" || echo "could not request the next run"
