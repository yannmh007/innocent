name: Build

# WHAT THIS REPLACES
#   The FlutLab loop: zip the tree, upload it, press Build, wait, read the
#   error on a phone screen, copy it back into a chat, get a patch, repeat.
#   That loop's real cost was never the typing — it was that nothing except
#   Yann could see the compiler. This workflow puts the compiler somewhere
#   both of us can read, which is the whole point.
#
# WHAT IT DOES NOT DO
#   It does not upload the APK anywhere or touch `app_releases`. It prints the
#   URL-ready facts (SHA-256, size, version) into the run summary and leaves
#   the two manual steps that follow. Automating those is worth doing once
#   this is boringly reliable, and not before.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# One build per branch. A second push while the first is still compiling
# cancels it rather than queueing — Gradle here takes ~15 minutes and the
# free tier is 2,000 minutes a month.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # WHY THIS STEP EXISTS. The first build to get past the analyzer died
      # ten minutes in, at :app:mergeReleaseNativeLibs:
      #
      #     > No space left on device
      #
      # Nothing in the tree was wrong. A runner ships something like 25 GB of
      # toolchains this project never touches, and on top of the Android SDK
      # this build still needs room for NDK 27 (~2.5 GB, and docs/CI.md notes
      # it is not cached), the native libraries of three ABIs, and Gradle's
      # own caches. It does not fit.
      #
      # Only things nothing in this workflow uses are removed, and this runs
      # before the JDK, Flutter and Android SDK steps so they install into the
      # freed space. Every removal is best-effort on purpose: a future runner
      # image that drops one of these paths must not fail the build. The df
      # lines are here so that the next disk failure names itself instead of
      # arriving as a Gradle stack trace.
      - name: Free runner disk space
        run: |
          set -uo pipefail
          echo "before: $(df -h / | awk 'NR==2 {print $4" free of "$2}')"
          # Deliberately NOT removed, though both are large and every
          # "free disk space" recipe online deletes them: /usr/share/miniconda
          # (the Structural checks step runs python3) and
          # /usr/local/lib/node_modules (every action here is JavaScript).
          # Neither is worth a red build to reclaim — what is left below
          # already frees several times what this build was short of.
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/.ghcup \
                      /opt/ghc \
                      /usr/local/share/powershell \
                      /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          docker image prune --all --force >/dev/null 2>&1 || true
          echo "after:  $(df -h / | awk 'NR==2 {print $4" free of "$2}')"

      # JDK 17 runs Gradle. It is NOT the same as the Java 11 in
      # build.gradle.kts — that one is the bytecode target for the app's own
      # Kotlin and Java. AGP 8.7 refuses to run on anything below 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        # PINNED. Left unpinned, `channel: stable` resolved to 3.47.2, whose
        # Gradle plugin refuses to build:
        #
        #     Your project's Gradle version (8.10.2) is lower than Flutter's
        #     minimum supported version of 8.14.0.
        #
        # That is the failure docs/CI.md warns about — nothing in this
        # repository changed, the toolchain moved underneath it.
        #
        # 3.32.8 is the newest patch of the line the project actually builds
        # on (README: "The build runs on Flutter 3.32"), and it matches the
        # Android toolchain this repo pins deliberately: Gradle 8.10.2,
        # AGP 8.7.0, Kotlin 2.1.0. Its Dart 3.8 satisfies pubspec's
        # `>=3.4.0 <4.0.0`.
        #
        # Raising this is a toolchain upgrade, not a version bump: Flutter
        # >=3.47 needs Gradle >=8.14.0, so the wrapper, AGP and Kotlin move
        # with it. pubspec already keeps share_plus <11.0.0 to avoid exactly
        # that. Do it deliberately, in its own commit, not by unpinning.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the exact SDK pieces this project pins
        run: |
          set -euo pipefail
          # compileSdk 36 and ndkVersion 27.0.12077973 come from
          # android/app/build.gradle.kts. If either changes there, change it
          # here in the same commit or the build breaks in a way whose error
          # message names neither file.
          sdkmanager "platforms;android-36" \
                     "build-tools;35.0.0" \
                     "build-tools;36.0.0" \
                     "ndk;27.0.12077973"

      - name: Toolchain
        run: |
          flutter --version
          java -version
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Resolve dependencies
        run: flutter pub get

      # The project's own eight structural checkers. They run here for the
      # same reason they run before a zip: they are fast, and they catch a
      # class of mistake that costs fifteen minutes of Gradle to discover.
      - name: Structural checks
        run: python3 tool/check.py

      # Errors fail the build. Warnings and infos do not — yet.
      #
      # analysis_options.yaml deliberately runs a wide rule set and there is a
      # known backlog behind it. A first CI run that fails on pre-existing lint
      # teaches exactly one lesson: turn the CI off. Read the list in this
      # step's log, clear it in its own commits, then delete the two flags.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # The unit tests, and unlike Analyze above they have NO tolerance flags:
      # a failing test fails the build.
      #
      # WHY THIS STEP EXISTS. test/update_download_test.dart covers the two
      # updater bugs that reached a real phone — a resume that restarted from
      # zero, and two writers appending to one .part until the SHA-256 failed
      # at 100%. Both only appear when a download is interrupted, which is
      # exactly the case nobody reproduces by hand before shipping. Tests that
      # only ever run on one laptop would not have caught either of them
      # coming back.
      #
      # Placed after Analyze and before the release build on purpose: it is
      # seconds of work that can spare fifteen minutes of Gradle, the same
      # reason the structural checks run where they do.
      - name: Test
        run: flutter test

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/innocent.jks
          # Size only. Never print the file, and never print a password.
          echo "keystore restored, $(stat -c%s android/app/innocent.jks) bytes"

      - name: Build release APK
        env:
          # build.gradle.kts reads these when no signing.properties or
          # key.properties exists — which is exactly the case here, because
          # .gitignore keeps both out of the repository.
          INNOCENT_STORE_FILE: innocent.jks
          INNOCENT_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          INNOCENT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          INNOCENT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      # THE CHECK THIS WHOLE PIPELINE EXISTS TO MAKE IMPOSSIBLE TO SKIP.
      #
      # Innocent has no Play Store. Android will refuse to update an installed
      # app with an APK signed by a different key, with no override and no
      # recovery — a single wrong-key release strands every existing install
      # permanently. Comparing the certificate here costs two seconds and
      # removes that failure mode from the project for good.
      - name: Verify the signature is the real Innocent key
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          EXPECTED=e3e1effa993ced6745a33f75c97742a3b8badd79d54927d2515538594c85cdb1
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
                   | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-Z' 'a-z')

          echo "expected: $EXPECTED"
          echo "actual  : $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::WRONG SIGNING KEY. This APK must not be distributed."
            exit 1
          fi
          echo "signature OK"

      - name: Collect the release facts
        id: facts
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VNAME=${VERSION%%+*}
          VCODE=${VERSION##*+}
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          BYTES=$(stat -c%s "$APK")
          MB=$(( (BYTES + 500000) / 1000000 ))
          NAME="innocent-${VNAME}-${VCODE}.apk"
          cp "$APK" "$NAME"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "vname=$VNAME" >> "$GITHUB_OUTPUT"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"

          # Everything needed for the in-app updater, ready to copy from a
          # phone. See docs/updater_plan.md.
          {
            echo "## ${VNAME} (${VCODE})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`${NAME}\` |"
            echo "| Size | ${MB} MB (${BYTES} bytes) |"
            echo "| SHA-256 | \`${SHA}\` |"
            echo "| Signature | verified against the Innocent key |"
            echo ""
            echo "Upload the artifact to R2 under \`apk/\`, then run:"
            echo ""
            echo '```sql'
            echo "update public.app_releases"
            echo "   set version_name = '${VNAME}',"
            echo "       version_code = ${VCODE},"
            echo "       apk_url    = 'https://pub-18c62521649645be87d4d36225021e15.r2.dev/apk/${NAME}',"
            echo "       apk_sha256 = '${SHA}',"
            echo "       apk_bytes  = ${BYTES},"
            echo "       notes_en   = 'CHANGE ME',"
            echo "       notes_mm   = 'CHANGE ME',"
            echo "       released_at = now()"
            echo " where id = 1;"
            echo '```'
            echo ""
            echo "> Set **both** \`notes_en\` and \`notes_mm\`. Changing only one"
            echo "> leaves some users reading the previous release's note."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: innocent-${{ steps.facts.outputs.vname }}-${{ steps.facts.outputs.vcode }}
          path: ${{ steps.facts.outputs.name }}
          # The free plan allows 500 MB of artifact storage in total and this
          # APK is ~88 MB, so five of them fill it. Short retention keeps the
          # allowance from becoming a mysterious "storage quota exceeded" a
          # month from now. Download the ones worth keeping.
          retention-days: 5
          compression-level: 0
