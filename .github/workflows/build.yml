name: Build

# WHAT THIS REPLACES
#   The FlutLab loop: zip the tree, upload it, press Build, wait, read the
#   error on a phone screen, copy it back into a chat, get a patch, repeat.
#   That loop's real cost was never the typing — it was that nothing except
#   Yann could see the compiler. This workflow puts the compiler somewhere
#   both of us can read, which is the whole point.
#
# WHAT IT DOES NOT DO
#   It does not upload the APK anywhere or touch `app_releases`. It prints the
#   URL-ready facts (SHA-256, size, version) into the run summary and leaves
#   the two manual steps that follow. Automating those is worth doing once
#   this is boringly reliable, and not before.

on:
  push:
    branches: [ main ]
    # DOCS-ONLY PUSHES DO NOT CUT A RELEASE.
    #
    # `docs/` holds the operator console, the SQL migrations, the Supabase
    # edge functions and the Cloudflare Worker. None of it is compiled into
    # the APK, and all of it is deployed by something other than this
    # workflow — GitHub Pages serves the console, Cloudflare's Workers Builds
    # watches `docs/worker`, and the rest is applied from a session.
    #
    # Without this filter, changing a comment in the Worker meant a
    # fifteen-minute Gradle build followed by a release step trying to create
    # a tag that already exists — and, when the version HAD been bumped to
    # avoid that, an "update available" prompt on every phone for an APK
    # identical to the one they were already running. Neither is a thing to
    # do to people.
    #
    # `workflow_dispatch` ignores path filters, so a build can still be run
    # by hand over any tree.
    paths-ignore:
      - 'docs/**'
      # The transcoding script runs on a GitHub runner against R2, never
      # inside the APK. Changing it cannot change a byte of the build, so a
      # push that only touches it should not spend fifteen minutes of Gradle
      # and then try to publish a release for a version that already has one.
      # It is still covered on every pull request and by workflow_dispatch.
      - 'tool/transcode.sh'
  pull_request:
  workflow_dispatch:

# One build per branch. A second push while the first is still compiling
# cancels it rather than queueing — Gradle here takes ~15 minutes and the
# free tier is 2,000 minutes a month.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # `contents: write` is needed by the release step at the end, and is the
    # ONLY elevated permission this workflow has. Declared explicitly rather
    # than inherited, because the repository default is read-only and a silent
    # 403 from `gh release` twenty minutes into a build is a bad way to find
    # that out.
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # WHY THIS STEP EXISTS. The first build to get past the analyzer died
      # ten minutes in, at :app:mergeReleaseNativeLibs:
      #
      #     > No space left on device
      #
      # Nothing in the tree was wrong. A runner ships something like 25 GB of
      # toolchains this project never touches, and on top of the Android SDK
      # this build still needs room for NDK 27 (~2.5 GB, and docs/CI.md notes
      # it is not cached), the native libraries of three ABIs, and Gradle's
      # own caches. It does not fit.
      #
      # Only things nothing in this workflow uses are removed, and this runs
      # before the JDK, Flutter and Android SDK steps so they install into the
      # freed space. Every removal is best-effort on purpose: a future runner
      # image that drops one of these paths must not fail the build. The df
      # lines are here so that the next disk failure names itself instead of
      # arriving as a Gradle stack trace.
      - name: Free runner disk space
        run: |
          set -uo pipefail
          echo "before: $(df -h / | awk 'NR==2 {print $4" free of "$2}')"
          # Deliberately NOT removed, though both are large and every
          # "free disk space" recipe online deletes them: /usr/share/miniconda
          # (the Structural checks step runs python3) and
          # /usr/local/lib/node_modules (every action here is JavaScript).
          # Neither is worth a red build to reclaim — what is left below
          # already frees several times what this build was short of.
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/.ghcup \
                      /opt/ghc \
                      /usr/local/share/powershell \
                      /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          docker image prune --all --force >/dev/null 2>&1 || true
          echo "after:  $(df -h / | awk 'NR==2 {print $4" free of "$2}')"

      # JDK 17 runs Gradle. It is NOT the same as the Java 11 in
      # build.gradle.kts — that one is the bytecode target for the app's own
      # Kotlin and Java. AGP 8.7 refuses to run on anything below 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        # PINNED. Left unpinned, `channel: stable` resolved to 3.47.2, whose
        # Gradle plugin refuses to build:
        #
        #     Your project's Gradle version (8.10.2) is lower than Flutter's
        #     minimum supported version of 8.14.0.
        #
        # That is the failure docs/CI.md warns about — nothing in this
        # repository changed, the toolchain moved underneath it.
        #
        # 3.32.8 is the newest patch of the line the project actually builds
        # on (README: "The build runs on Flutter 3.32"), and it matches the
        # Android toolchain this repo pins deliberately: Gradle 8.10.2,
        # AGP 8.7.0, Kotlin 2.1.0. Its Dart 3.8 satisfies pubspec's
        # `>=3.4.0 <4.0.0`.
        #
        # Raising this is a toolchain upgrade, not a version bump: Flutter
        # >=3.47 needs Gradle >=8.14.0, so the wrapper, AGP and Kotlin move
        # with it. pubspec already keeps share_plus <11.0.0 to avoid exactly
        # that. Do it deliberately, in its own commit, not by unpinning.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Do not let the action install its default package set.
          #
          # setup-android@v3 defaults to `packages: 'tools platform-tools'`,
          # and Google has REMOVED the obsolete `tools` package from the SDK
          # repository. sdkmanager now answers "Failed to find package 'tools'"
          # and exits 1, which fails this step before any of this project's
          # code is even fetched — so every build on every branch broke at once
          # on a day nobody touched the repository.
          #
          # Empty rather than 'platform-tools': nothing in this workflow uses
          # adb. The pieces that ARE needed are installed explicitly by the
          # next step, which is where they belong — it is the one that has to
          # stay in sync with android/app/build.gradle.kts.
          #
          # The action still does the two things it is here for with an empty
          # package list: it puts sdkmanager on PATH and exports ANDROID_HOME.
          packages: ''

      - name: Install the exact SDK pieces this project pins
        run: |
          set -euo pipefail
          # compileSdk 36 and ndkVersion 27.0.12077973 come from
          # android/app/build.gradle.kts. If either changes there, change it
          # here in the same commit or the build breaks in a way whose error
          # message names neither file.
          sdkmanager "platforms;android-36" \
                     "build-tools;35.0.0" \
                     "build-tools;36.0.0" \
                     "ndk;27.0.12077973"

      - name: Toolchain
        run: |
          flutter --version
          java -version
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Resolve dependencies
        run: flutter pub get

      # The project's own eight structural checkers. They run here for the
      # same reason they run before a zip: they are fast, and they catch a
      # class of mistake that costs fifteen minutes of Gradle to discover.
      - name: Structural checks
        run: python3 tool/check.py

      # Errors fail the build. Warnings and infos do not — yet.
      #
      # analysis_options.yaml deliberately runs a wide rule set and there is a
      # known backlog behind it. A first CI run that fails on pre-existing lint
      # teaches exactly one lesson: turn the CI off. Read the list in this
      # step's log, clear it in its own commits, then delete the two flags.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # The unit tests, and unlike Analyze above they have NO tolerance flags:
      # a failing test fails the build.
      #
      # WHY THIS STEP EXISTS. test/update_download_test.dart covers the two
      # updater bugs that reached a real phone — a resume that restarted from
      # zero, and two writers appending to one .part until the SHA-256 failed
      # at 100%. Both only appear when a download is interrupted, which is
      # exactly the case nobody reproduces by hand before shipping. Tests that
      # only ever run on one laptop would not have caught either of them
      # coming back.
      #
      # Placed after Analyze and before the release build on purpose: it is
      # seconds of work that can spare fifteen minutes of Gradle, the same
      # reason the structural checks run where they do.
      - name: Test
        run: flutter test

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/innocent.jks
          # Size only. Never print the file, and never print a password.
          echo "keystore restored, $(stat -c%s android/app/innocent.jks) bytes"

      # android/gradle.properties is tuned, in detail and for good reasons, for
      # FlutLab.io's ~4 GB container: a 2 GB Gradle heap, one worker, no
      # parallelism, no daemon, Kotlin compiled in-process. Every one of those
      # numbers was chosen against a real OOM, and its comment says which.
      #
      # This runner is not that container. ubuntu-latest has 16 GB and 4 cores,
      # so the 2 GB cap is not protecting anything here — it is the thing that
      # fails. On 19 Sep a build died with:
      #
      #     Execution failed for JetifyTransform: armeabi_v7a_release-...jar
      #       > Java heap space
      #
      # Jetifier rewriting an 80 MB Flutter engine jar inside a 2 GB heap, on a
      # machine with 16 GB free. Intermittent, because it depends on what else
      # is live when that transform runs — which is worse than a hard failure,
      # not better: it costs a fifteen-minute cycle at random.
      #
      # APPENDED, not edited. A Java properties file takes the LAST value for a
      # key, so this overrides the FlutLab numbers here without touching them
      # there — the project still builds on FlutLab with the settings that
      # environment needs.
      #
      # Only the heap is changed. Workers, parallelism and the Kotlin strategy
      # stay as they are: one variable at a time, and this is the one the
      # failure named.
      - name: Give Gradle the runner's memory, not FlutLab's
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## Appended by .github/workflows/build.yml — CI only."
            echo "org.gradle.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
          } >> android/gradle.properties
          echo "effective heap setting:"
          grep '^org.gradle.jvmargs' android/gradle.properties | tail -1

      - name: Build release APK
        env:
          # build.gradle.kts reads these when no signing.properties or
          # key.properties exists — which is exactly the case here, because
          # .gitignore keeps both out of the repository.
          INNOCENT_STORE_FILE: innocent.jks
          INNOCENT_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          INNOCENT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          INNOCENT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      # THE CHECK THIS WHOLE PIPELINE EXISTS TO MAKE IMPOSSIBLE TO SKIP.
      #
      # Innocent has no Play Store. Android will refuse to update an installed
      # app with an APK signed by a different key, with no override and no
      # recovery — a single wrong-key release strands every existing install
      # permanently. Comparing the certificate here costs two seconds and
      # removes that failure mode from the project for good.
      - name: Verify the signature is the real Innocent key
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          EXPECTED=e3e1effa993ced6745a33f75c97742a3b8badd79d54927d2515538594c85cdb1
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
                   | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-Z' 'a-z')

          echo "expected: $EXPECTED"
          echo "actual  : $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::WRONG SIGNING KEY. This APK must not be distributed."
            exit 1
          fi
          echo "signature OK"

      - name: Collect the release facts
        id: facts
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VNAME=${VERSION%%+*}
          VCODE=${VERSION##*+}
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          BYTES=$(stat -c%s "$APK")
          MB=$(( (BYTES + 500000) / 1000000 ))
          NAME="innocent-${VNAME}-${VCODE}.apk"
          cp "$APK" "$NAME"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "vname=$VNAME" >> "$GITHUB_OUTPUT"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "mb=$MB" >> "$GITHUB_OUTPUT"

          # Everything needed for the in-app updater, ready to copy from a
          # phone. See docs/updater_plan.md.
          {
            echo "## ${VNAME} (${VCODE})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`${NAME}\` |"
            echo "| Size | ${MB} MB (${BYTES} bytes) |"
            echo "| SHA-256 | \`${SHA}\` |"
            echo "| Signature | verified against the Innocent key |"
            echo ""
            echo "The APK is attached to release \`v${VNAME}-${VCODE}\`:"
            echo ""
            echo "    https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VNAME}-${VCODE}/${NAME}"
            echo ""
            echo "That URL is permanent and serves the file directly, so it"
            echo "can be used as \`apk_url\` as-is. The R2 copy below stays the"
            echo "documented route; use whichever you prefer, but make sure"
            echo "\`apk_url\` and \`apk_sha256\` describe the SAME file."
            echo ""
            echo "To keep using R2: upload the release asset there under"
            echo "\`apk/\`, then run:"
            echo ""
            echo '```sql'
            echo "update public.app_releases"
            echo "   set version_name = '${VNAME}',"
            echo "       version_code = ${VCODE},"
            echo "       apk_url    = 'https://pub-18c62521649645be87d4d36225021e15.r2.dev/apk/${NAME}',"
            echo "       apk_sha256 = '${SHA}',"
            echo "       apk_bytes  = ${BYTES},"
            echo "       notes_en   = 'CHANGE ME',"
            echo "       notes_mm   = 'CHANGE ME',"
            echo "       released_at = now()"
            echo " where id = 1;"
            echo '```'
            echo ""
            echo "> Set **both** \`notes_en\` and \`notes_mm\`. Changing only one"
            echo "> leaves some users reading the previous release's note."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the APK as a Release asset
        # WHY A RELEASE AND NOT AN ARTIFACT (18 Sep 2026)
        # ───────────────────────────────────────────────
        # This step used to be actions/upload-artifact. It broke, and the way
        # it broke is the reason it is gone rather than fixed.
        #
        # The free plan allows 500 MB of Actions ARTIFACT storage and this APK
        # is ~88 MB, so six of them fill it. With ten pull requests open at
        # once, ten builds each stored one inside the same five-day retention
        # window. From 15 Sep every upload answered:
        #
        #     Failed to CreateArtifact: Artifact storage quota has been hit.
        #     Usage is recalculated every 6-12 hours.
        #
        # AFTER a completely successful build — analyze, 251 tests, a signed
        # 88.5 MB APK, signature verified — so a green tree reported red four
        # times running. Skipping the upload on pull requests was not enough,
        # and deleting four artifacts did not clear it either: the block is on
        # a usage figure GitHub recalculates on its own schedule, and it had
        # not moved a full day later.
        #
        # Release assets do not touch that quota at all. They also fix two
        # things the artifact was bad at anyway: the download is a direct file
        # rather than a zip, and the URL is permanent rather than expiring in
        # five days — which is what `docs/updater_plan.md` needs for
        # `app_releases.apk_url`.
        #
        # MAIN ONLY, by ref rather than by event.
        #
        # A PR build's job is to prove the tree compiles, the tests pass and
        # the APK signs, and all three are finished before this step. Nobody
        # installs an APK from a PR and nobody wants a Release per PR.
        #
        # But "not a pull request" was the wrong way to say that. It also
        # matched workflow_dispatch, and a dispatch runs on whatever branch you
        # point it at — so re-running this workflow by hand on a topic branch
        # cut a real, public GitHub Release and tagged it at an UNMERGED
        # commit. That happened: v1.64.11-324 was created from
        # claude/adb-tail, and once the PR squash-merges, the tag points at a
        # commit that is not on main and never will be. The tag is what
        # docs/updater_plan.md hangs app_releases.apk_url on, so its
        # provenance has to mean something.
        #
        # Testing the ref says what was meant: a release comes from main, no
        # matter which event started the run. Dispatch on a branch is then
        # exactly what it should be — a build, and nothing else.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.facts.outputs.vname }}-${{ steps.facts.outputs.vcode }}
          NAME: ${{ steps.facts.outputs.name }}
        run: |
          set -euo pipefail

          # A TAG MUST NAME THE COMMIT ITS APK WAS BUILT FROM.
          #
          # `gh release create` with no --target does NOT tag the commit being
          # built. It tags the DEFAULT BRANCH HEAD at the moment it runs. Those
          # are the same commit only when nothing merged while the build was
          # running, and on 19 Sep they were not: v1.64.11-324 was created
          # while main's HEAD was still 73c3ddd — which is 1.64.9+322 — so a
          # tag naming 1.64.11 pointed at a 1.64.9 tree, while the notes named
          # a third commit. Three answers to one question.
          #
          # docs/updater_plan.md hangs app_releases.apk_url on these tags. A
          # tag naming the wrong tree makes "which source built the APK my
          # users are running" unanswerable.
          #
          # Three cases, and they are genuinely different:
          NOTES="Built from \`${GITHUB_SHA}\` by the Build workflow.

          | | |
          |---|---|
          | File | \`${NAME}\` |
          | Size | ${{ steps.facts.outputs.mb }} MB (${{ steps.facts.outputs.bytes }} bytes) |
          | SHA-256 | \`${{ steps.facts.outputs.sha }}\` |
          | Signature | verified against the Innocent key |

          Check the download before installing:

          \`\`\`
          sha256sum ${NAME}
          \`\`\`"

          # Does the tag already exist, and at which commit?
          #
          # `|| true` was wrong here and cost a red main. On a missing ref
          # `gh api` prints its error body to STDOUT and exits non-zero:
          #
          #     {"message":"Not Found","status":"404"}
          #
          # `|| true` threw the exit code away and kept the body, so `tagged`
          # held that JSON — non-empty, and not equal to $GITHUB_SHA. The guard
          # below then fired on the one case it must never fire on: a brand new
          # version. v1.64.12-325 failed exactly this way.
          #
          # So: test gh's EXIT STATUS, not the emptiness of its output. And
          # then check the shape, because this step cannot be exercised by a
          # branch build (it is main-only) and has now been wrong twice. A git
          # object id is forty hex characters; anything else is not an answer
          # and is treated as "no tag".
          if tagged=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
                        --jq .object.sha 2>/dev/null); then
            :
          else
            tagged=""
          fi
          printf '%s' "$tagged" | grep -Eq '^[0-9a-f]{40}$' || tagged=""

          if gh release view "$TAG" >/dev/null 2>&1; then
            # (1) THIS VERSION IS ALREADY PUBLISHED, SO ITS APK IS LEFT ALONE.
            #
            # This step used to rebuild the asset here with `--clobber`, on the
            # reasoning that a rebuild of a published version is normal — a CI
            # fix, a re-run, a commit that changes no Dart. It is normal. What
            # is not survivable is REPLACING the file, and on 26 Sep it cost
            # every user their update.
            #
            # v1.64.36-349 was released at 09:16 from 65925fcd. Its APK hashed
            # ba46942e…, and that hash went into `app_releases.apk_sha256`,
            # which is what the in-app updater checks a finished download
            # against. Four hours later a commit touching only tool/ and
            # .github/ — neither covered by paths-ignore — rebuilt the same
            # version and clobbered the asset with e0cec1df…. Same size to the
            # byte; different content, because APK signing is not
            # reproducible.
            #
            # Every phone then downloaded ninety megabytes, hashed it, found
            # the wrong answer and said "Download was damaged. Try again." —
            # correctly, and for ever, because retrying fetched the same file.
            # On a Myanmar mobile connection that is ninety megabytes of
            # somebody's data per attempt. The integrity check was the only
            # part of the chain behaving properly.
            #
            # There is no fix for this inside the workflow: it cannot reach
            # the database, by design, and even if it could, a phone that
            # started its download before the swap would still fail. The only
            # sound rule is that A PUBLISHED VERSION'S APK NEVER CHANGES.
            # Getting a different binary to users is what a version bump is
            # for, and it costs one line in pubspec.yaml.
            #
            # The build still ran: the tree compiles, the tests pass, the
            # signature is the Innocent key. That is the whole job of a build
            # for a version that is already out.
            if gh release view "$TAG" --json assets --jq '.assets[].name' \
                 | grep -Fxq "$NAME"; then
              echo "::warning::$TAG is already published and its APK was NOT" \
                   "replaced. This build ($GITHUB_SHA) reaches nobody. Bump" \
                   "the version in pubspec.yaml to ship it."
              {
                echo ""
                echo "## Nothing was published"
                echo ""
                echo "\`$TAG\` already exists and **its APK was left"
                echo "untouched**, so the SQL above is for a file that was not"
                echo "uploaded — ignore it, and do not change"
                echo "\`app_releases\`."
                echo ""
                echo "A published version's APK never changes: the updater"
                echo "checks a finished download against"
                echo "\`app_releases.apk_sha256\`, and replacing the file"
                echo "makes every update fail the check, on every retry, for"
                echo "everyone. Bump the version in \`pubspec.yaml\` to ship"
                echo "this build."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "left alone: $(gh release view "$TAG" --json url --jq .url)"
              exit 0
            fi
            # The release exists and carries no asset: the upload failed after
            # the release was created. Finishing that is not replacing
            # anything, so it goes ahead.
            echo "release $TAG exists but has no asset yet — uploading"
            if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::warning::tag $TAG names $tagged, the commit that first" \
                   "published this version; this asset was built from" \
                   "$GITHUB_SHA. Bump the version if they need to agree."
            fi
            gh release edit "$TAG" --notes "$NOTES"
          elif [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            # (2) A STALE TAG WITH NO RELEASE. Stop.
            #
            # This is the case that actually bit us, and it cannot be fixed
            # from here: `gh release create` REUSES an existing tag and
            # silently ignores --target, so carrying on would rebuild the
            # release straight back onto the wrong commit. Deleting only the
            # release and re-running — the obvious thing to try — lands
            # exactly here.
            echo "::error::tag $TAG already exists at $tagged but there is no" \
                 "release for it, and this build is $GITHUB_SHA. Delete the" \
                 "tag as well, or bump the version. Publishing now would" \
                 "label this APK with someone else's commit."
            exit 1
          else
            # (3) A NEW VERSION. --target pins the tag to this build.
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Innocent ${{ steps.facts.outputs.vname }} (${{ steps.facts.outputs.vcode }})" \
              --notes "$NOTES"
          fi

          # --clobber for the one case that reaches here with a file already
          # present: a partial upload under this name. A release that already
          # carries a complete asset returned above and never gets this far,
          # which is the point — see case (1).
          gh release upload "$TAG" "$NAME" --clobber

          echo "published: $(gh release view "$TAG" --json url --jq .url)"
