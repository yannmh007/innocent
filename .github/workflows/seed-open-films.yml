# Seed a few famous CC-BY Blender open movies into the catalogue, to exercise
# streaming and download with real films. Run by hand (workflow_dispatch).
#
# EVERY FILM HERE IS CREATIVE COMMONS ATTRIBUTION (CC-BY): the Blender open
# movies are made to be shared, so this is a legitimate test catalogue, not a
# copy of anyone's rights. Each becomes one album: the master video and five
# stills taken from the film itself.
#
# The bytes move on this runner, exactly as every other master does: the
# runner downloads the film, asks the ingest function to presign a PUT for an
# `open-film-<slug>/…` key (seed_sign, INGEST_SECRET), uploads, then asks it
# to make the catalogue row (seed_title), sent for review. The runner never
# holds a bucket credential or the database key.
#
# Since 6 Nov 2026 the films come from video.blender.org, whose API states
# each video's licence; tool/open_films.py refuses anything but CC BY or CC0
# and checks the download is the film whose licence it read.
name: Seed open films

on:
  workflow_dispatch:
    inputs:
      task:
        description: "find: what video.blender.org has, with licences. seed: load the films. seal: make sealed twins of their videos (docs/MEDIA_ENCRYPTION.md §9 B)"
        type: choice
        options: [find, seed, seal]
        default: find
      kind:
        description: "seal only: what to seal — the videos, the images (poster, photos, thumbnails), both, or the video masters alone (video-master)"
        type: choice
        options: [video, image, both, video-master]
        default: video
      titles:
        description: "seal only: title ids, space-separated (open films only; the function refuses any other)"
        type: string
        default: "0839dacb-59ae-4c95-9279-4901b925965d ab8b0f1e-e23b-4141-94ba-67f1b29a7765"
      dry:
        description: "seed only: check the licence, download and probe each film, make its stills — and upload nothing"
        type: boolean
        default: true
      names:
        description: "find only: film names to look up, separated by commas"
        type: string
        default: "Cosmos Laundromat,Caminandes,Spring,Coffee Run,Sprite Fright,Charge,Wing It,Hero,Agent 327,Glass Half,Big Buck Bunny,Elephants Dream,Sintel,Tears of Steel"

permissions:
  contents: read

jobs:
  # SEALED TWINS of the open films' videos — the canary of media seal v1.
  # tool/seal_twins.py asks the ingest function for a plan (a DEK per object,
  # issued and wrapped there), seals each object, opens the whole twin again
  # and compares it byte for byte, uploads it, and hands it back to be checked
  # and recorded (seal_plan / seal_commit). The function allows open films
  # only. Nothing secret is printed: presigned URLs and DEKs stay in memory.
  seal:
    if: inputs.task == 'seal'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the cipher
        run: python3 -m pip install --quiet --disable-pip-version-check 'cryptography==50.0.2'
      - name: Seal, check, upload, record
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          RUNNER_SECRET: ${{ secrets.INGEST_SECRET }}
          TITLES: ${{ inputs.titles }}
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          if [ -z "${SB_URL:-}" ] || [ -z "${RUNNER_SECRET:-}" ]; then
            echo "::error::SUPABASE_URL or INGEST_SECRET not set"; exit 1
          fi
          # Ids only: anything else in the input is dropped, not passed on.
          ids=$(printf '%s' "$TITLES" | tr -cs '0-9a-f-' ' ')
          scope=""
          case "${KIND:-video}" in
            video) kinds="video" ;;
            image) kinds="image" ;;
            both) kinds="video image" ;;
            video-master) kinds="video"; scope="master" ;;
            *) echo "::error::kind must be video, image, both or video-master"; exit 1 ;;
          esac
          for k in $kinds; do
            echo "== $k ${scope}"
            # shellcheck disable=SC2086
            SEAL_KIND="$k" SEAL_SCOPE="$scope" python3 tool/seal_twins.py $ids
          done

  # WHAT THE OFFICIAL SITE HAS. Read-only: for each name, the videos
  # video.blender.org publishes, with the licence its API states, the length
  # and the files on offer (tool/open_films.py). Nothing is downloaded.
  find:
    if: inputs.task == 'find'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Look the films up
        env:
          NAMES: ${{ inputs.names }}
        run: |
          set -euo pipefail
          # Names only: letters, digits, spaces, a few marks; commas split them.
          IFS=',' read -ra list <<< "$(printf '%s' "$NAMES" | tr -cd "A-Za-z0-9 ,:'!-")"
          python3 tool/open_films.py find "${list[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  seed:
    if: inputs.task == 'seed'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq

      # EACH FILM, IN ORDER, AND EACH STEP MUST PASS OR THE FILM IS SKIPPED:
      #   1. its licence, read now from video.blender.org's API (open_films.py
      #      pick): CC BY or CC0, nothing else; and the file to take;
      #   2. the download, then ffprobe against what the site said (open_films.py
      #      check): H.264 at that height, with sound, the right length;
      #   3. five stills from the film itself;
      #   4. (not with dry) the stills and the master into R2 through presigned
      #      PUTs (seed_sign), then the title row (seed_title), SENT FOR REVIEW:
      #      it waits on the console's Review page like any upload, and nothing
      #      reaches the app until someone approves it there.
      # The video is queued for its ladder; the next transcode run builds it.
      - name: Check, download, and seed for review
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          RUNNER_SECRET: ${{ secrets.INGEST_SECRET }}
          DRY: ${{ inputs.dry }}
        run: |
          set -uo pipefail
          if [ "${DRY:-false}" != true ] && { [ -z "${SB_URL:-}" ] || [ -z "${RUNNER_SECRET:-}" ]; }; then
            echo "::error::SUPABASE_URL or INGEST_SECRET not set"; exit 1
          fi
          FN="${SB_URL:-}/functions/v1/ingest"

          # slug | title | year | video.blender.org id | synopsis
          # Chosen 6 Nov 2026 from a find run (42240921914): the five whose
          # licence the site states as CC BY, each adding something the four
          # films already here do not (docs/BACKLOG.md "Open test films").
          # Already seeded (9 and 17 Oct): Sintel, Big Buck Bunny, Elephants
          # Dream, Tears of Steel; seed_title answers "existing" for a slug it
          # has, so a second run makes nothing twice.
          films=(
            "open-film-cosmos-laundromat|Cosmos Laundromat|2015|f507dfdc-e73e-45a4-9778-d758cbe1ce96|On a desolate island, a sheep who has lost the will to live meets a strange salesman who offers him the gift of a lifetime."
            "open-film-caminandes-llamigos|Caminandes: Llamigos|2016|23f3ef79-15dc-44c5-aa45-cf92e78a4509|Winter in Patagonia: Koro the llama and Oti the pesky penguin fight over the last tasty berry."
            "open-film-glass-half|Glass Half|2015|64222c8a-c4c7-4b3b-9850-7fb2078edcf6|Two art critics in a gallery see the same works very differently, and neither will give way."
            "open-film-hero|Hero|2018|3eb93cab-79a2-4fd5-a636-d42e5c59ddea|A short 2D action film, drawn frame by frame with Blender's Grease Pencil."
            "open-film-big-buck-bunny-60fps|Big Buck Bunny (60 fps)|2008|6402b77c-b61f-4a06-96ca-c8420a2becf4|A big, gentle rabbit takes comic revenge on three bullying rodents. This is the 2013 re-render at 60 frames a second, to try smooth high-frame-rate playback."
          )

          # Presign a PUT for one open-film object and upload a local file to it.
          put() {   # slug name kind file  -> echoes object_key
            local slug="$1" name="$2" kind="$3" file="$4"
            local code
            code=$(curl -sS -o /tmp/sign.json -w '%{http_code}' -X POST "$FN" \
              -H "Authorization: Bearer $RUNNER_SECRET" -H 'Content-Type: application/json' \
              -d "{\"op\":\"seed_sign\",\"slug\":\"$slug\",\"name\":\"$name\",\"kind\":\"$kind\"}")
            if [ "$code" != "200" ]; then echo "  sign $name: HTTP $code" >&2; return 1; fi
            local url key
            url=$(jq -r .put_url /tmp/sign.json); key=$(jq -r .object_key /tmp/sign.json)
            local ct='application/octet-stream'
            [ "$kind" = photo ] && ct='image/jpeg'
            [ "$kind" = video ] && ct='video/mp4'
            # NEVER printed: the presigned URL is a secret in a public log.
            if ! curl --fail-with-body -sS -X PUT -T "$file" -H "Content-Type: $ct" "$url" >/dev/null; then
              echo "  put $name: upload failed" >&2; return 1
            fi
            echo "$key"
          }

          made=0; checked=0; skipped=0
          for line in "${films[@]}"; do
            IFS='|' read -r slug title year uuid synopsis <<< "$line"
            echo "=== $title ($slug) ==="
            rm -f /tmp/master.mp4 /tmp/still-*.jpg /tmp/pick.json /tmp/probe.json

            # 1. The licence, now, from the source.
            if ! python3 tool/open_films.py pick "$uuid" > /tmp/pick.json; then
              echo "  SKIP: $(cat /tmp/pick.json)"; skipped=$((skipped+1)); continue
            fi
            lic=$(jq -r .licence /tmp/pick.json); attr=$(jq -r .attribution /tmp/pick.json)
            page=$(jq -r .page /tmp/pick.json); url=$(jq -r .url /tmp/pick.json)
            echo "  licence $lic; file $(jq -r .height /tmp/pick.json)p$(jq -r '.fps // ""' /tmp/pick.json), $(( $(jq -r '.size // 0' /tmp/pick.json) / 1000000 )) MB"

            # 2. The download, then is it the film the licence was read for?
            if ! curl --fail-with-body -sSL --max-time 1800 -o /tmp/master.mp4 "$url"; then
              echo "  SKIP: download failed"; skipped=$((skipped+1)); continue
            fi
            ffprobe -v error -show_streams -show_format -of json /tmp/master.mp4 > /tmp/probe.json 2>/dev/null || echo '{}' > /tmp/probe.json
            if ! python3 tool/open_films.py check /tmp/pick.json /tmp/probe.json; then
              echo "  SKIP: not the film the licence was read for"; skipped=$((skipped+1)); continue
            fi
            bytes=$(stat -c%s /tmp/master.mp4)
            w=$(jq -r '[.streams[]|select(.codec_type=="video" and .codec_name=="h264")][0].width' /tmp/probe.json)
            h=$(jq -r '[.streams[]|select(.codec_type=="video" and .codec_name=="h264")][0].height' /tmp/probe.json)
            fps=$(jq -r '[.streams[]|select(.codec_type=="video" and .codec_name=="h264")][0].avg_frame_rate' /tmp/probe.json)
            dur=$(jq -r '.format.duration' /tmp/probe.json | cut -d. -f1)
            ach=$(jq -r '[.streams[]|select(.codec_type=="audio")][0].channels' /tmp/probe.json)
            echo "  master ${w}x${h} ${fps} fps, ${dur}s, ${ach}-channel sound, $((bytes/1000000)) MB"

            # 3. Five stills, evenly spaced away from the very start and end.
            n_stills=0
            for i in 1 2 3 4 5; do
              t=$(( dur * (i * 20 - 10) / 100 ))
              ffmpeg -nostdin -y -ss "$t" -i /tmp/master.mp4 -frames:v 1 \
                -vf "scale='min(1280,iw)':-2" -q:v 3 "/tmp/still-$i.jpg" >/dev/null 2>&1
              [ -s "/tmp/still-$i.jpg" ] && n_stills=$((n_stills+1))
            done
            echo "  $n_stills stills"
            checked=$((checked+1))
            echo "- **$title** ($year) — $lic, ${w}x${h} ${fps} fps, ${dur}s, $((bytes/1000000)) MB, $n_stills stills" >> "$GITHUB_STEP_SUMMARY"
            if [ "${DRY:-false}" = true ]; then echo "  (dry: nothing uploaded)"; continue; fi

            # 4. Into R2, then the row, sent for review.
            photos_json='[]'
            for i in 1 2 3 4 5; do
              out="/tmp/still-$i.jpg"
              [ -s "$out" ] || continue
              pk=$(put "$slug" "still-$i.jpg" photo "$out") || continue
              pw=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$out" 2>/dev/null)
              photos_json=$(echo "$photos_json" | jq -c \
                --arg k "$pk" --argjson w "$(echo "$pw" | cut -d, -f1)" --argjson h "$(echo "$pw" | cut -d, -f2)" \
                --argjson b "$(stat -c%s "$out")" '. + [{object_key:$k,width:$w,height:$h,bytes:$b}]')
            done
            vk=$(put "$slug" "master.mp4" video /tmp/master.mp4) || { echo "  SKIP: video upload failed"; skipped=$((skipped+1)); continue; }

            syn="$synopsis

          Creative Commons Attribution ($lic): $attr. Source: $page. Re-encoded for streaming."
            note="Open film from video.blender.org ($uuid). Licence $lic read from the site's API on $(date -u +%Y-%m-%d); master ${w}x${h} ${fps} fps ${dur}s with sound, checked with ffprobe; $n_stills stills. Look at it, set its Burmese title and genres if you like, then approve or send back."
            payload=$(jq -nc \
              --arg slug "$slug" --arg title "$title" --argjson year "$year" --arg syn "$syn" --arg note "$note" \
              --arg vk "$vk" --argjson vb "$bytes" --argjson vw "$w" --argjson vh "$h" --argjson vd "$dur" \
              --argjson photos "$photos_json" \
              '{op:"seed_title",slug:$slug,title:$title,year:$year,synopsis:$syn,review:"ready",review_note:$note,
                video:{object_key:$vk,bytes:$vb,width:$vw,height:$vh,duration_s:$vd,mime:"video/mp4"},
                photos:$photos}')
            code=$(curl -sS -o /tmp/seed.json -w '%{http_code}' -X POST "$FN" \
              -H "Authorization: Bearer $RUNNER_SECRET" -H 'Content-Type: application/json' -d "$payload")
            if [ "$code" = 200 ]; then
              echo "  title $(jq -r .id /tmp/seed.json): $(jq -r '.assets // "existing"' /tmp/seed.json) files, review $(jq -r '.review // "unchanged"' /tmp/seed.json)"
              made=$((made+1))
            else
              echo "  seed_title: HTTP $code $(head -c 300 /tmp/seed.json)"; skipped=$((skipped+1))
            fi
          done

          echo "=== checked $checked, seeded $made, skipped $skipped ==="
          if [ "${DRY:-false}" = true ]; then [ "$checked" -gt 0 ]; else [ "$made" -gt 0 ]; fi
