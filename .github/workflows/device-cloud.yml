# Device cloud: the RELEASED APK on real phones in Firebase Test Lab.
#
# WHY, NEXT TO THE DEVICE LAB
#   device-lab.yml runs an emulator: good for flows and layout, but it cannot
#   run the arm64 release APK, and it has no real video decoder — playback
#   there proved nothing either way. Test Lab runs the very file people
#   install on physical phones in Google's racks, with a Robo crawler that
#   taps through the app on its own after a short script (test_device/robo/)
#   has walked it into Movies. It returns screenshots, a video, the logcat,
#   and any crash.
#
# SETUP (once, by the owner): a Firebase project used only for testing, its
# Cloud Testing and Tool Results APIs enabled, and a service account key for
# it stored as the Actions secret FIREBASE_SA_KEY, with the project id as
# FIREBASE_PROJECT_ID. No other secret is needed and none is printed.
# Without them this workflow says what is missing and stops — green.
#
# RESULTS are committed to test_device/results/cloud/ on the branch that ran
# it: per phone, the outcome, Robo's screenshots (resized, and ENCRYPTED with
# the LAB_RESULTS_KEY secret — they show adult material and the repository is
# public) and the app's logcat with links and tokens cut out. The video stays in Test Lab — too big
# for git; its console link is in the summary.
#
# QUOTA: the free plan allows five physical-device tests a day; each phone in
# test_device/cloud.env is one.

name: Device cloud

on:
  push:
    branches-ignore: [ main ]
    paths:
      - 'test_device/cloud.env'
      - 'test_device/robo/**'
      - '.github/workflows/device-cloud.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: device-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Are the Firebase secrets set?
        id: ready
        env:
          SA: ${{ secrets.FIREBASE_SA_KEY }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ] || [ -z "$PROJECT" ]; then
            echo "::notice::FIREBASE_SA_KEY / FIREBASE_PROJECT_ID are not set yet — see the header of this workflow. Nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Which mode
        id: mode
        if: steps.ready.outputs.ok == 'true'
        run: |
          source test_device/cloud.env
          echo "mode=${MODE:-robo}" >> "$GITHUB_OUTPUT"
          echo "fetch=${FETCH_RUN:-}" >> "$GITHUB_OUTPUT"

      # ── MODE=playback: this branch, built for arm64 as a lab APK ──────────
      # Debug-signed (see INNOCENT_LAB_ABI in build.gradle.kts), so it can
      # never pass for a release; logs CpuProbe and the playback trail to
      # logcat, and answers Test Lab's game-loop launch by playing the film
      # pushed below (src/lab/AndroidManifest.xml, lib/app.dart).
      - uses: actions/setup-java@v4
        if: steps.mode.outputs.mode == 'playback' && steps.mode.outputs.fetch == ''
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: steps.mode.outputs.mode == 'playback' && steps.mode.outputs.fetch == ''
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        if: steps.mode.outputs.mode == 'playback' && steps.mode.outputs.fetch == ''
        with:
          packages: ''
      - name: Build the arm64 lab APK and the film
        if: steps.mode.outputs.mode == 'playback' && steps.mode.outputs.fetch == ''
        env:
          INNOCENT_LAB_ABI: arm64-v8a
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "org.gradle.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> android/gradle.properties
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --dart-define=INNOCENT_LAB=true
          cp build/app/outputs/flutter-apk/app-release.apk app.apk
          echo "TAG=lab-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          # The film: 720p H.264 at a film's bitrate, long enough for the
          # three phases of the script (about 165 s).
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=24 \
            -f lavfi -i sine=frequency=330 -t 200 -c:v libx264 -preset veryfast \
            -b:v 2500k -maxrate 3000k -bufsize 6000k -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart play.mp4
          ls -la app.apk play.mp4

      - name: Fetch the released APK
        if: steps.mode.outputs.mode != 'playback' && steps.mode.outputs.fetch == '' && steps.ready.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source test_device/cloud.env
          tag="$APK_TAG"
          [ "$tag" = latest ] && tag=$(gh release view --json tagName --jq .tagName)
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" -p '*.apk' -O app.apk
          ls -la app.apk

      - uses: google-github-actions/auth@v2
        if: steps.ready.outputs.ok == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.ready.outputs.ok == 'true'

      - name: Run on real phones
        if: steps.ready.outputs.ok == 'true'
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -uo pipefail
          source test_device/cloud.env
          gcloud config set project "$PROJECT" >/dev/null
          mkdir -p out
          # What Test Lab can offer, so cloud.env can be pointed at the
          # phones Myanmar actually carries.
          gcloud firebase test android models list --filter=form=PHYSICAL \
            --format='table(id,brand,name,supportedVersionIds.list())' > out/models.txt 2>&1 || true

          device_args=()
          for d in $DEVICES; do
            m=${d%%,*}; v=${d##*,}
            device_args+=(--device "model=$m,version=$v,locale=$LOCALE,orientation=portrait")
          done
          dir="innocent/${GITHUB_RUN_ID}"
          if [ -n "${FETCH_RUN:-}" ]; then
            # Only collect what an earlier run left in Test Lab's bucket
            # (its results are kept there for 90 days) — no new test, no
            # quota spent.
            dir="innocent/${FETCH_RUN}"
            echo "fetching the results of run $FETCH_RUN" > out/run.txt
            echo "storage/browser/${BUCKET}/${dir}/" >> out/run.txt
            echo '{}' > out/matrix.json
            rc=0
          elif [ "${MODE:-robo}" = playback ]; then
            # Left alone for the whole run: no crawler, just the film.
            gcloud firebase test android run \
              --type game-loop \
              --app app.apk \
              "${device_args[@]}" \
              --other-files /sdcard/Download/innocent_lab_play.mp4=play.mp4 \
              --timeout 240s \
              --results-dir "$dir" \
              --format=json > out/matrix.json 2> out/run.txt && rc=0 || rc=$?
          else
            gcloud firebase test android run \
              --type robo \
              --app app.apk \
              "${device_args[@]}" \
              --robo-script test_device/robo/movies.json \
              --timeout "${TIMEOUT}s" \
              --results-dir "$dir" \
              --format=json > out/matrix.json 2> out/run.txt && rc=0 || rc=$?
          fi
          # Non-zero also means "a phone failed or was inconclusive"; the
          # results are still there and still worth keeping.
          echo "exit $rc" >> out/run.txt
          tail -20 out/run.txt

          # gcloud names the bucket only inside a console link:
          # .../storage/browser/<bucket>/<dir>/
          bucket=$(sed -n 's#.*storage/browser/\([^/]*\)/.*#\1#p' out/run.txt | head -1 || true)
          echo "bucket: ${bucket:-unknown}"
          if [ -n "$bucket" ]; then
            mkdir -p out/raw
            gcloud storage cp -r "gs://$bucket/$dir/*" out/raw/ >/dev/null 2>&1 || true
            find out/raw -maxdepth 2 | head -20
          fi

      - name: Keep the results
        if: always() && steps.ready.outputs.ok == 'true'
        env:
          LAB_RESULTS_KEY: ${{ secrets.LAB_RESULTS_KEY }}
        run: |
          set -e
          dest=test_device/results/cloud
          rm -rf "$dest"; mkdir -p "$dest"
          cp out/models.txt out/run.txt out/matrix.json "$dest/" 2>/dev/null || true
          if [ -d out/raw ]; then
            for dev in out/raw/*/; do
              [ -d "$dev" ] || continue
              name=$(basename "$dev"); mkdir -p "$dest/$name/shots"
              find "$dev" -name 'logcat' -exec sh -c \
                "sed -E 's#https?://[^ \"]+#<url>#g; s#[A-Za-z0-9_-]{40,}#<token>#g' '{}' \
                 | grep -iE 'innocent|flutter|mpv|AndroidRuntime|FATAL|ANR|crash|LAB ' > '$dest/$name/logcat.txt'" \; || true
              # The lab build's own measurements, on their own: CpuProbe's
              # per-thread lines, the decode pipeline, the script's phases.
              grep -o 'LAB .*\|video .*hwdec=.*\|decoder [a-zA-Z]*: .*' "$dest/$name/logcat.txt" > "$dest/$name/lab_trace.txt" 2>/dev/null || true
              find "$dev" -name '*.png' | head -60 | while read -r p; do
                cp "$p" "$dest/$name/shots/$(basename "$(dirname "$p")")_$(basename "$p")"
              done
              find "$dest/$name/shots" -name '*.png' -exec mogrify -resize 480x {} \; 2>/dev/null || true
              # Never in the clear — see test_device/run.sh.
              if [ -n "${LAB_RESULTS_KEY:-}" ]; then
                tar -czf - -C "$dest/$name" shots | openssl enc -aes-256-cbc -pbkdf2 -salt \
                  -pass env:LAB_RESULTS_KEY -out "$dest/$name/shots.tar.gz.enc"
              fi
              rm -rf "$dest/$name/shots"
            done
          fi
          echo "run ${GITHUB_RUN_ID} of ${GITHUB_SHA} on ${TAG:-?}" > "$dest/RUN.txt"
          git config user.name "device-cloud"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$dest"
          git commit -q -m "device-cloud: results of run ${GITHUB_RUN_ID}" || exit 0
          # A playback run built the app in this checkout, which leaves
          # changed and untracked files behind; `pull --rebase` refuses to
          # run over them, and the results were lost that way once.
          git stash --include-untracked -q || true
          branch="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$branch" && git push -q origin "HEAD:$branch" && exit 0
            sleep $((i * 5))
          done
          exit 1
