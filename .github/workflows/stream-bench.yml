# The stream proxy over lines shaped like a phone's, measured.
#
# WHY. "4 MB/s on the meter, and the film still buffers" cannot be seen on a
# fast desk connection, and the device lab's emulator shaping caps speed and
# adds delay but drops nothing — and loss is what holds a single TCP
# connection back on a mobile line. `tc netem` on this runner's loopback adds
# all three: a round trip, a loss rate and a rate cap. The real proxy
# (StreamCacheServer) then plays a film from a local Range server through
# that line, once on one connection (as every build up to 1.64.58 did) and
# once on three (as it does now), and says how fast, how long the black
# screen lasted and how often playback ran dry.
#
# Runs on a push to a branch that changes the bench, the proxy or this file,
# and by hand.
name: Stream bench

on:
  push:
    branches-ignore: [ main ]
    paths:
      - 'test_bench/stream_bench.dart'
      - 'test_bench/mpv_seek_bench.dart'
      - 'lib/features/video_hub/data/cache/stream_cache_server.dart'
      - 'lib/features/video_hub/data/api/ranged_fetch.dart'
      - 'lib/features/video_hub/presentation/playback.dart'
      - 'lib/features/video_hub/domain/warm_rule.dart'
      - 'lib/features/video_hub/domain/cmaf_index.dart'
      - 'lib/features/video_hub/domain/held_grant.dart'
      - 'test/held_grant_test.dart'
      - 'lib/features/player/presentation/player_provider.dart'
      - 'lib/features/player/presentation/player_controller_gestures.dart'
      - 'lib/features/player/presentation/player_screen.dart'
      - 'lib/core/services/video_player/media_kit_player_service.dart'
      - 'test/media_kit_reopen_start_test.dart'
      - 'lib/features/player/domain/climb_rule.dart'
      - 'test/stream_cache_server_test.dart'
      - 'test/cmaf_index_test.dart'
      - 'test/support/cmaf.dart'
      - '.github/workflows/stream-bench.yml'
  workflow_dispatch:
    inputs:
      mpv_only:
        description: 'Only the mpv seek bench (no unit tests, no proxy bench)'
        type: boolean
        default: false
      mpv_profiles:
        description: 'Lines for the mpv seek bench'
        default: 'desk,mm_4g,mm_4g_lossy,mm_busy'
      mpv_variants:
        description: 'Variants (see test_bench/mpv_seek_bench.dart)'
        default: 'shipped+nohand+norounds,shipped'
      mpv_repeat:
        description: 'Runs of each line'
        default: '1'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - run: flutter pub get

      # THE ANALYZER AND THE UNIT TESTS FIRST — the same two commands, with
      # the same tolerance, that the release build runs on main. A branch
      # that changes the proxy or the play path then hears about a type error
      # or a broken test minutes after the push, not at release time, and the
      # bench below never measures code that does not hold together.
      - name: Analyze
        if: ${{ !inputs.mpv_only }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # libmpv and ffmpeg for test/media_kit_reopen_start_test.dart: the real
      # media_kit opening a real film twice, to hold a reopen to its start
      # (1.64.68 began every reopen at 00:00). Skipped where they are absent.
      - name: libmpv and ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmpv2 mpv ffmpeg
      - name: Unit tests
        if: ${{ !inputs.mpv_only }}
        run: flutter test

      - name: netem available
        run: |
          sudo modprobe sch_netem 2>/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" && sudo modprobe sch_netem; }
          tc -V
          # A phone's packets are 1500 bytes; loopback's are 64 KB, and one
          # lost 64 KB packet is forty real ones. Real-sized packets, or the
          # loss figures below mean nothing.
          sudo ip link set dev lo mtu 1500

      # ONLY THE INTERNET HOP IS SHAPED. The bench's Range server listens on
      # port 47123; a prio qdisc sends its outgoing packets (the film) through
      # netem with delay, loss and the rate cap, and packets to it (requests,
      # ACKs) through delay alone. The proxy-to-player hop — inside the phone
      # in real life — stays a plain loopback. The first version shaped the
      # whole interface, the player's own connection included, and measured
      # that instead of the network.
      #
      # Each profile: one-way delay (round trip is twice), loss on the film's
      # packets, rate cap.
      #   desk         no shaping — the software's own ceiling
      #   mm_4g        150 ms round trip, 0.5 % loss, 32 Mbit/s (4 MB/s, the meter)
      #   mm_4g_lossy  200 ms round trip, 1 % loss, 32 Mbit/s
      #   mm_busy      250 ms round trip, 2 % loss, 16 Mbit/s (an evening cell)
      - name: Bench
        if: ${{ !inputs.mpv_only }}
        run: |
          set -u
          PORT=47123
          run() {
            name="$1"; delay="$2"; loss="$3"; rate="$4"
            sudo tc qdisc del dev lo root 2>/dev/null || true
            if [ "$delay" != "-" ]; then
              sudo tc qdisc add dev lo root handle 1: prio bands 5
              sudo tc qdisc add dev lo parent 1:4 handle 40: netem delay "$delay" loss "$loss" rate "$rate" limit 10000
              sudo tc qdisc add dev lo parent 1:5 handle 50: netem delay "$delay" limit 10000
              sudo tc filter add dev lo parent 1:0 protocol ip prio 1 u32 match ip sport $PORT 0xffff flowid 1:4
              sudo tc filter add dev lo parent 1:0 protocol ip prio 2 u32 match ip dport $PORT 0xffff flowid 1:5
            fi
            echo "== $name: delay $delay loss $loss rate $rate"
            BENCH_MB=24 BENCH_KBPS=6000 BENCH_PORT=$PORT BENCH_LANES=1,3,6 BENCH_OUT="/tmp/$name.txt" \
              flutter test test_bench/stream_bench.dart 2>&1 | grep -E 'lanes=|Error|FAIL' || true
            sudo tc qdisc del dev lo root 2>/dev/null || true
            { echo "### $name (delay $delay, loss $loss, rate $rate)"; echo '```'; cat "/tmp/$name.txt" 2>/dev/null || echo "no result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          }
          run desk - - -
          run mm_4g 75ms 0.5% 32mbit
          run mm_4g_lossy 100ms 1% 32mbit
          run mm_busy 125ms 2% 16mbit

      # THE REAL PLAYER THROUGH THE REAL PROXY (test_bench/mpv_seek_bench.dart):
      # mpv with the app's stream options reading a ladder-shaped film through
      # StreamCacheServer, on the same shaped lines. Open, twenty seconds of
      # play, then a seek, a skip, a jump back and a far seek — each with the
      # time to the moving picture and the requests and megabytes it took
      # from the line. `before` is the proxy without the hand-over and the
      # post-seek growth; `after` is what ships.
      - name: mpv seek bench
        env:
          PROFILES: ${{ inputs.mpv_profiles || 'desk,mm_4g,mm_4g_lossy,mm_busy' }}
          VARIANTS: ${{ inputs.mpv_variants || 'shipped+nohand+norounds,shipped' }}
          REPEAT: ${{ inputs.mpv_repeat || '1' }}
        run: |
          set -u
          PORT=47123
          ffmpeg -nostdin -v error -y -f lavfi -i testsrc2=size=640x360:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 -t 600 -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset ultrafast -b:v 1572k -minrate 1572k -maxrate 1572k -bufsize 1700k \
            -x264-params nal-hrd=cbr -g 48 -keyint_min 48 -sc_threshold 0 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ac 2 -ar 48000 \
            -movflags +frag_keyframe+empty_moov+default_base_moof+global_sidx+cmaf+skip_trailer /tmp/film.mp4
          run() {
            name="$1"; delay="$2"; loss="$3"; rate="$4"
            sudo tc qdisc del dev lo root 2>/dev/null || true
            if [ "$delay" != "-" ]; then
              sudo tc qdisc add dev lo root handle 1: prio bands 5
              sudo tc qdisc add dev lo parent 1:4 handle 40: netem delay "$delay" loss "$loss" rate "$rate" limit 10000
              sudo tc qdisc add dev lo parent 1:5 handle 50: netem delay "$delay" limit 10000
              sudo tc filter add dev lo parent 1:0 protocol ip prio 1 u32 match ip sport $PORT 0xffff flowid 1:4
              sudo tc filter add dev lo parent 1:0 protocol ip prio 2 u32 match ip dport $PORT 0xffff flowid 1:5
            fi
            for i in $(seq 1 "$REPEAT"); do
              echo "== $name #$i: delay $delay loss $loss rate $rate"
              BENCH_FILM=/tmp/film.mp4 BENCH_FILM_S=600 BENCH_FILM_KBPS=1700 BENCH_LINE_KBPS=0 BENCH_RTT_MS=0 \
                BENCH_PORT=$PORT BENCH_PATHS=proxy6 BENCH_VARIANTS="$VARIANTS" \
                BENCH_OUT="/tmp/mpv-$name-$i.txt" \
                flutter test test_bench/mpv_seek_bench.dart 2>&1 | grep -E '^proxy6|^line|Error|FAIL' || true
              { echo "### mpv seek, $name #$i (delay $delay, loss $loss, rate $rate)"; echo '```'; \
                cat "/tmp/mpv-$name-$i.txt" 2>/dev/null || echo "no result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            done
            sudo tc qdisc del dev lo root 2>/dev/null || true
          }
          for p in ${PROFILES//,/ }; do
            case "$p" in
              desk) run desk - - - ;;
              mm_4g) run mm_4g 75ms 0.5% 32mbit ;;
              mm_4g_lossy) run mm_4g_lossy 100ms 1% 32mbit ;;
              mm_busy) run mm_busy 125ms 2% 16mbit ;;
            esac
          done
