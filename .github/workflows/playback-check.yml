# Ask request-playback for a free published title, the way the app does, and
# print the SHAPE of the answer — status, which door (`edge`, `s3`, `rung`),
# how many streaming copies, whether `url` is set. Never the URLs: they are
# signed and this log is public.
#
# MANUAL ONLY. Run it after deploying request-playback: that function is what
# every viewer goes through, real traffic can be one request an hour, and a
# deploy that does not boot would otherwise be found by a viewer.
name: Playback check

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'A free title id to check (empty: the first free published one)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Ask for a free title's playback
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          # The publishable key. Not a secret — it ships in every APK and in
          # the console's own page.
          SB_KEY: sb_publishable_vTiAxBAhnZL_BqFcZD4m9A_Rb8Q8PHj
          # Through the environment, never pasted into the script: a value
          # typed into the dispatch form is then data, whatever it contains.
          TITLE_INPUT: ${{ inputs.title }}
        run: |
          set -euo pipefail
          id="$TITLE_INPUT"
          case "$id" in ''|*[!0-9a-f-]*) [ -z "$id" ] || { echo "not a title id"; exit 1; } ;; esac
          [ -n "$id" ] || id=$(curl -sS "$SB_URL/rest/v1/titles?select=id&access_tier=eq.free&published=eq.true&limit=1" \
            -H "apikey: $SB_KEY" | python3 -c "import json,sys;r=json.load(sys.stdin);print(r[0]['id'] if r else '')")
          if [ -z "$id" ]; then echo "no free published title"; exit 1; fi
          echo "$id" > /tmp/title_id
          code=$(curl -sS -o /tmp/p.json -w '%{http_code}' -X POST "$SB_URL/functions/v1/request-playback" \
            -H "apikey: $SB_KEY" -H 'Content-Type: application/json' -d "{\"title_id\":\"$id\"}")
          echo "HTTP $code"
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/p.json'))
          print('url set:', bool(d.get('url')), '| via:', d.get('via'),
                '| rungs:', len(d.get('renditions') or []), '| code:', d.get('code'))
          PY
          [ "$code" = "200" ]

      # THE EDGE PATH, PROVED ON THE REAL WORKER. The same byte ranges are
      # fetched through the stream Worker three ways: on the edge (block)
      # path twice — cold, then warm — and once with `X-Edge-Bypass: 1`,
      # which sends it down the direct R2 path the Worker has always had.
      # The three must be identical, byte for byte; a mismatch fails the run.
      # `X-Edge` says what the cache did (`blocks=1; HIT`). Only statuses,
      # sizes, timings and that header are printed — never a URL: it carries
      # a live token and this log is public.
      - name: Edge path — byte-compare through the real Worker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, sys, time, urllib.request, urllib.error
          d = json.load(open('/tmp/p.json'))
          rungs = [r for r in (d.get('renditions') or []) if r.get('url')]
          # The smallest copy keeps the check cheap; the original if none.
          rungs.sort(key=lambda r: r.get('bytes') or 10**18)
          url = rungs[0]['url'] if rungs else d.get('url')
          if not url:
              print('no playable url in the answer'); sys.exit(1)

          def fetch(rng, bypass=False):
              # Cloudflare turns Python's default User-Agent away with a 403
              # before the Worker ever runs (first run of this step); a named
              # one, like the app's own, is let through.
              h = {'Range': rng, 'User-Agent': 'innocent-playback-check/1'}
              if bypass:
                  h['X-Edge-Bypass'] = '1'
              t = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=90) as r:
                      body = r.read()
                      return (r.status, r.headers.get('Content-Range'),
                              r.headers.get('X-Edge') or 'direct', body,
                              int((time.time() - t) * 1000))
              except urllib.error.HTTPError as e:
                  return (e.code, e.headers.get('Content-Range'), 'direct', b'',
                          int((time.time() - t) * 1000))

          st, cr, _, _, _ = fetch('bytes=0-8191', bypass=True)
          if st != 206 or not cr or '/' not in cr:
              print(f'probe through the direct path failed: HTTP {st}'); sys.exit(1)
          total = int(cr.split('/')[-1])
          B = 4 * 1024 * 1024
          ranges = [('probe 8 KB', 0, 8191),
                    ('2 MB part from the start', 0, 2 * 1024 * 1024 - 1)]
          if total > B + 1024 * 1024:
              ranges.append(('2 MB part across a block boundary', B - 1024 * 1024, B + 1024 * 1024 - 1))
          ranges.append(('the last 100 KB', max(0, total - 100000), total - 1))
          ranges.append(('end past EOF (clamped)', max(0, total - 500), total + 5000))
          print(f'object: {total / 1048576:.1f} MB')
          bad = used = hits = 0
          for name, s, e in ranges:
              rng = f'bytes={s}-{e}'
              c = fetch(rng)            # edge, cold
              w = fetch(rng)            # edge, warm
              x = fetch(rng, bypass=True)  # direct
              same = (c[3] == x[3] == w[3]) and c[0] == x[0] == w[0] == 206 and c[1] == x[1]
              bad += not same
              # `blocks=…` is the edge path; `off; <why>` is the direct path
              # saying why the edge stepped aside; nothing at all is a Worker
              # older than the edge path.
              used += c[2].startswith('blocks=')
              hits += 'HIT' in w[2]
              dig = hashlib.sha256(x[3]).hexdigest()[:10]
              print(f"{'ok ' if same else 'BAD'} {name:<38} {len(x[3]):>8} B sha {dig} | "
                    f"edge cold {c[4]:>5} ms [{c[2]}] warm {w[4]:>5} ms [{w[2]}] | direct {x[4]:>5} ms")
          print(f'edge path used on {used} of {len(ranges)} ranges; warm HIT on {hits}')
          if bad:
              print(f'{bad} range(s) DIFFER between the edge and the direct path'); sys.exit(1)
          print('every range identical on both paths')
          PY

      - name: Grant time, asked the way the app asks
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: sb_publishable_vTiAxBAhnZL_BqFcZD4m9A_Rb8Q8PHj
        run: |
          set -euo pipefail
          # The app pins request-playback beside the database
          # (x-region: ap-southeast-1); this runner is in the US, so each
          # figure is the function's own time plus one trip across the
          # Pacific. The function's own share is in its logs
          # (execution_time_ms). Five asks; the first may meet a cold start.
          python3 - <<'PY'
          import json, os, time, urllib.request
          tid = open('/tmp/title_id').read().strip()
          ms = []
          for i in range(5):
              req = urllib.request.Request(
                  os.environ['SB_URL'] + '/functions/v1/request-playback',
                  data=json.dumps({'title_id': tid, 'device_id': 'grant-time-check'}).encode(),
                  headers={'apikey': os.environ['SB_KEY'], 'Content-Type': 'application/json',
                           'x-region': 'ap-southeast-1', 'User-Agent': 'innocent-playback-check/1'},
                  method='POST')
              t = time.time()
              with urllib.request.urlopen(req, timeout=60) as r:
                  r.read()
                  code = r.status
              ms.append(int((time.time() - t) * 1000))
              print(f'grant {i + 1}: HTTP {code} in {ms[-1]} ms')
          warm = sorted(ms[1:])
          print(f'warm median {warm[len(warm) // 2]} ms, best {warm[0]} ms')
          PY

      # PHASE 1 (2026-10-22), PROVED ON THE REAL FUNCTION AND WORKER. A grant
      # asked for with an install id and `bind: true` must come back bound:
      # through the Worker, the right install says `X-Bind: ok`, none or
      # another says `missing` / `mismatch` — and, while BIND_MODE is "log",
      # every one of them still plays. The first answer (no install id) is
      # not bound and says nothing. Every answer must say `private,
      # no-store`, which is also how this step knows the new Worker is the
      # one deployed. Statuses and headers only — never a URL.
      #
      # ENFORCED SINCE 2026-10-25. The Worker's `/health` says which mode the
      # bind check is in, and the cases are judged by it: in "enforce", no
      # header and another install get the same bare 404 as any refusal,
      # while the right install and an unbound (older app's) token still
      # play. A Worker whose `/health` does not name a mode is older than
      # this check, and fails it.
      - name: Phase 1 — bound tokens and what a cache may keep
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: sb_publishable_vTiAxBAhnZL_BqFcZD4m9A_Rb8Q8PHj
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, uuid, urllib.parse, urllib.request, urllib.error
          UA = 'innocent-playback-check/1'
          first = json.load(open('/tmp/p.json'))
          # The title the first step used — the one asked for, when one was.
          tid = open('/tmp/title_id').read().strip()
          dev = 'playback-check-' + uuid.uuid4().hex[:12]
          req = urllib.request.Request(
            os.environ['SB_URL'] + '/functions/v1/request-playback',
            data=json.dumps({'title_id': tid, 'device_id': dev, 'bind': True}).encode(),
            headers={'apikey': os.environ['SB_KEY'], 'Content-Type': 'application/json',
                     'User-Agent': UA}, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  code, bound = r.status, json.loads(r.read())
          except urllib.error.HTTPError as e:
              code, bound = e.code, json.loads(e.read() or b'{}')
          print(f'bound grant: HTTP {code} via={bound.get("via")} code={bound.get("code")}')
          if code != 200:
              sys.exit(1)

          def smallest(d):
              rs = sorted([r for r in d.get('renditions') or [] if r.get('url')],
                          key=lambda r: r.get('bytes') or 10**18)
              return rs[0]['url'] if rs else d.get('url')

          def fetch(url, device=None):
              h = {'Range': 'bytes=0-65535', 'User-Agent': UA}
              if device:
                  h['X-Innocent-Device'] = device
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=60) as r:
                      return r.status, len(r.read()), r.headers.get('Cache-Control'), r.headers.get('X-Bind')
              except urllib.error.HTTPError as e:
                  return e.code, 0, e.headers.get('Cache-Control'), e.headers.get('X-Bind')

          # The Worker's own word on its mode; its origin is the grant's.
          parts = urllib.parse.urlsplit(smallest(bound))
          hq = urllib.request.Request(f'{parts.scheme}://{parts.netloc}/health',
                                      headers={'User-Agent': UA})
          health = json.load(urllib.request.urlopen(hq, timeout=30))
          mode = health.get('bind')
          print(f"/health: bind={mode} limit={health.get('limit')}")
          if mode not in ('log', 'enforce'):
              print('the Worker does not say which mode the bind check is in'); sys.exit(1)

          cases = [
            ('unbound, no header', smallest(first), None, None),
            ('bound, right install', smallest(bound), dev, 'ok'),
            ('bound, no header', smallest(bound), None, 'missing'),
            ('bound, another install', smallest(bound), 'someone-else', 'mismatch'),
          ]
          bad = 0
          for name, url, device, want in cases:
              st, n, cc, xb = fetch(url, device)
              if mode == 'enforce' and want in ('missing', 'mismatch'):
                  # Refused before a byte is read, saying nothing about why.
                  ok = st == 404 and n == 0 and cc == 'no-store' and xb is None
                  want = 'refused'
              else:
                  ok = st == 206 and n == 65536 and cc == 'private, no-store' and xb == want
              bad += not ok
              print(f"{'ok ' if ok else 'BAD'} {name:<24} HTTP {st} {n:>6} B | "
                    f"Cache-Control: {cc} | X-Bind: {xb} (want {want})")
          if bad:
              print(f'{bad} case(s) wrong'); sys.exit(1)
          if mode == 'enforce':
              print('bound tokens are enforced: the right install plays, any other is refused; nothing may be kept')
          else:
              print('bound tokens are checked, log mode refuses nothing, nothing may be kept')
          PY

      # WHAT A SEEK READS. Every copy's top-level boxes, tracks and sidx (does
      # each sidx's fragments add up to the end of the file? FFmpeg jumps
      # straight to a fragment only when they do), then a seek to 40 % of the
      # 720p copy through a relay that logs every range — with this runner's
      # ffmpeg and mpv, and with FFmpeg 6.0, which the app's libmpv is built
      # on. See tool/playback/layout_and_seek.py. Never a URL.
      - name: Fragment layout and a seek, through the real Worker
        run: |
          set -uo pipefail
          # Bounded and non-interactive: on 26 Oct this line sat silent for
          # the job's whole 20 minutes, twice, before a byte was measured.
          echo "installing ffmpeg and mpv"
          sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get update -qq \
            && sudo DEBIAN_FRONTEND=noninteractive timeout 400 apt-get install -y -qq \
                 -o Dpkg::Options::=--force-confdef ffmpeg mpv >/dev/null \
            || echo "::warning::ffmpeg/mpv did not install in time"
          echo "installed: $(command -v ffmpeg) $(command -v mpv)"
          mkdir -p /tmp/ff60 && curl -sSfL -o /tmp/ff60/ff.gz \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-x64.gz \
            && gunzip -f /tmp/ff60/ff.gz && chmod +x /tmp/ff60/ff || true
          python3 tool/playback/layout_and_seek.py /tmp/p.json /tmp/ff60/ff
