# Known vulnerabilities in the app's dependencies — Google's OSV-Scanner
# against the open OSV database (GitHub Advisories, the Dart and Go
# ecosystems' own feeds, and more).
#
# WHY HERE. pubspec.lock pins every Dart package the APK carries, and a
# published advisory against one of them is the cheapest warning there is:
# someone else found it. Free, open source, and nothing leaves the runner but
# the package names and versions.
#
# WHEN. Every Monday, whenever the dependencies change, and by hand. A
# finding fails the run, so it shows as a red mark with the default e-mail,
# not a line in a log nobody reads.
#
# WHAT IT READS: A FRESH LOCK. The committed pubspec.lock is not what ships —
# every build runs `flutter pub get`, and the committed file had fallen so far
# behind that it did not list google_sign_in at all (found 2026-10-23). So
# this resolves the dependencies exactly as the Build workflow does, with the
# same pinned Flutter, and scans what that produces.
#
# THE ANDROID HALF (job `android`). The Java and Kotlin libraries in the APK
# (smbj, sshj, commons-net, jcifs-ng, Bouncy Castle, Media3, CameraX, every
# plugin's own) are in no Dart lock, and this project keeps no Gradle lock.
# So Gradle resolves the release classpath exactly as a build would, and
# tool/gradle_lock.py writes what it resolved as a gradle.lockfile to scan.
#
# THE BINARY IS CHECKED, not trusted: a fixed release, and its SHA-256 is
# compared before it runs — the same rule as the pinned actions.
name: Dependency scan

on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'third_party/*/pubspec.yaml'
      - 'android/app/build.gradle.kts'
      - 'android/build.gradle.kts'
      - 'android/settings.gradle.kts'
      - 'tool/gradle_lock.py'
      - 'tool/osv-scanner-android.toml'
      - '.github/workflows/deps-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The Build workflow's Flutter, for the same resolution.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - name: Resolve the dependencies the APK gets
        run: flutter pub get

      - name: OSV-Scanner 2.2.2, checked
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.2.2/osv-scanner_linux_amd64
          echo "c799274b682e0437c802d4714a136ad09b39c65547c460049ba5358d28afa576  /tmp/osv-scanner" \
            | sha256sum -c -
          chmod +x /tmp/osv-scanner

      - name: Scan the Dart lock
        run: /tmp/osv-scanner scan source --lockfile pubspec.lock

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The Build workflow's toolchain, for the same resolution: JDK 17 for
      # Gradle, the pinned Flutter (its Gradle plugin adds the plugins'
      # Android projects), the SDK platform compileSdk names.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''

      - name: Resolve the Android libraries the APK gets
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" >/dev/null
          flutter pub get
          # Writes local.properties and the Gradle wrapper, builds nothing.
          flutter build apk --config-only
          mkdir -p "$RUNNER_TEMP/scan"
          ( cd android && ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath ) \
            > "$RUNNER_TEMP/deps.txt"
          python3 tool/gradle_lock.py "$RUNNER_TEMP/deps.txt" > "$RUNNER_TEMP/scan/gradle.lockfile"
          grep -c '=releaseRuntimeClasspath' "$RUNNER_TEMP/scan/gradle.lockfile"

      - name: OSV-Scanner 2.2.2, checked
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.2.2/osv-scanner_linux_amd64
          echo "c799274b682e0437c802d4714a136ad09b39c65547c460049ba5358d28afa576  /tmp/osv-scanner" \
            | sha256sum -c -
          chmod +x /tmp/osv-scanner

      # tool/osv-scanner-android.toml: the advisories accepted while minSdk
      # is 24, each with why and until when.
      - name: Scan the Android libraries
        run: |
          /tmp/osv-scanner scan source --config tool/osv-scanner-android.toml \
            --lockfile "$RUNNER_TEMP/scan/gradle.lockfile"
