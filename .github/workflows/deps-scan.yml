# Known vulnerabilities in the app's dependencies — Google's OSV-Scanner
# against the open OSV database (GitHub Advisories, the Dart and Go
# ecosystems' own feeds, and more).
#
# WHY HERE. pubspec.lock pins every Dart package the APK carries, and a
# published advisory against one of them is the cheapest warning there is:
# someone else found it. Free, open source, and nothing leaves the runner but
# the package names and versions.
#
# WHEN. Every Monday, whenever the lock changes, and by hand. A finding fails
# the run, so it shows as a red mark with the default e-mail, not a line in a
# log nobody reads.
#
# THE BINARY IS CHECKED, not trusted: a fixed release, and its SHA-256 is
# compared before it runs — the same rule as the pinned actions.
name: Dependency scan

on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - 'pubspec.lock'
      - '.github/workflows/deps-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: OSV-Scanner 2.2.2, checked
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.2.2/osv-scanner_linux_amd64
          echo "c799274b682e0437c802d4714a136ad09b39c65547c460049ba5358d28afa576  /tmp/osv-scanner" \
            | sha256sum -c -
          chmod +x /tmp/osv-scanner

      - name: Scan the Dart lock
        run: /tmp/osv-scanner scan source --lockfile pubspec.lock
