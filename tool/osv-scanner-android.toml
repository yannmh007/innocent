# Advisories the dependency scan's Android job (deps-scan.yml) accepts, each
# with why, and each until a date so it comes back to be looked at again.
#
# WHY ANY. Two libraries cannot be raised to their fixed versions while the
# app installs on Android 7 (minSdk 24): Jackson 2.14-2.18 and Commons
# Compress 1.21+ need Android 8 (API 26). Both arrive only through the
# downloader engine, youtubedl-android 0.18.1, which pins Jackson 2.11.1
# (held to 2.13.5 in android/app/build.gradle.kts) and Commons Compress 1.12.
#
# WHAT THE APP FEEDS THEM (read from youtubedl-android 0.18.1's sources).
#   Jackson: the app never calls the library's getInfo, the one place it
#   reads yt-dlp's report; the app runs yt-dlp itself and reads the report
#   in Dart. Jackson is left reading one thing, the yt-dlp updater's answer
#   from api.github.com over TLS (YoutubeDLUpdater.checkForUpdate), and
#   nothing turns on polymorphic typing, which the gadget advisories need.
#   Commons Compress opens only the Python runtime zipped inside the APK
#   itself, signed with it (ZipUtils.unzip, on first use); never a file from
#   the network.
#
# THE WAY OUT is minSdk 26 (Android 8), which the owner decides; then
# Jackson 2.18.11+ and Commons Compress 1.28+ and this file empties.

