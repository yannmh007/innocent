# While the album downloads, play its video — the case reported from the
# field as "spins and will not play".
appId: com.innocent.media
---
- scrollUntilVisible:
    element:
      text: ".*1:11:19.*"
    direction: DOWN
    optional: true
- tapOn:
    text: ".*1:11:19.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
# The viewer opens on the clip's poster; its play button is in the middle.
# A viewer looks before tapping: the app asks the server ahead meanwhile.
- extendedWaitUntil:
    visible: "__nothing_has_this_text__"
    timeout: 3000
    optional: true
- tapOn:
    point: "50%,50%"
- tapOn:
    text: "Got it"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 40_stream_while_dl_15s
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 41_stream_while_dl_30s
- back
