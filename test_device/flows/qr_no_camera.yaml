# The QR scanner on a phone with no camera (2026-10-23). Run with
# EMU_CAMERA=none. Until 1.64.70's fix this crashed the whole app the moment
# the scanner opened: CameraX 1.4 fails its start-up when it finds no
# camera, and mobile_scanner 5.2.3 rethrew it on the main thread (device lab
# run 39894951775). Now the screen stays, says what to do, and shows no
# viewfinder.
appId: com.innocent.media
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "(?s).*Tab 3 of 4.*"
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: "RECEIVE"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "(?s).*Scan the sender.*"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "(?i)(While using the app|Only this time|Allow)"
    optional: true
# CameraX retries for several seconds before it gives up; the old crash came
# at about seven.
- extendedWaitUntil:
    visible: "(?s).*camera can't be opened.*"
    timeout: 20000
- takeScreenshot: 62_qr_no_camera
- extendedWaitUntil:
    visible: "__nothing_has_this_text__"
    timeout: 5000
    optional: true
- assertVisible: "Scan sender QR"
- assertVisible: "(?s).*camera can't be opened.*"
- assertNotVisible: "(?s).*Point the camera.*"
- back
- waitForAnimationToEnd:
    timeout: 3000
# Back on Receive, where the address can be typed.
- assertVisible: "(?s).*Scan the sender.*"
