# THE DOWNLOAD ENGINE on a fresh install (1.64.79: Jackson 2.11 -> 2.13.5).
# Opening Downloads unpacks yt-dlp's Python (Commons Compress) and then
# updates yt-dlp, which reads GitHub's answer with the library's Jackson;
# run.sh greps the "LAB engine update" line. Then an open film's direct link
# (the Sintel trailer, CC-BY, Blender Foundation) is read by yt-dlp and the
# quality sheet opens.
appId: com.innocent.media
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "(?s).*Tab 4 of 4.*"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "(?s)Downloads.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 130_downloads_open
- extendedWaitUntil:
    notVisible: "(?s).*Preparing download engine.*"
    timeout: 180000
- extendedWaitUntil:
    notVisible: "(?s).*Updating engine.*"
    timeout: 180000
- assertNotVisible: "(?s).*Download engine unavailable.*"
- tapOn: "(?s).*Paste a video link.*"
- inputText: "https://download.blender.org/durian/trailer/sintel_trailer-480p.mp4"
- hideKeyboard
- tapOn:
    text: "Download"
    index: 0
- extendedWaitUntil:
    visible: "(?s).*(480|Quality|MB).*"
    timeout: 90000
- takeScreenshot: 131_downloads_quality
