# A TV remote: only the D-pad and Back. Moves focus down the Video tab,
# opens a folder with the centre key, comes back. Screenshots show where
# the focus ring is at each step.
appId: com.innocent.media
---
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Down
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 80_remote_focus_1
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Down
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 81_remote_focus_2
- pressKey: Remote Dpad Center
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 82_remote_opened
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 83_remote_back
# Back on a tab other than the first goes to the first tab, not out of the
# app: Music, then Back, must land on Video. First back to the library's
# tabs from wherever the steps above ended (a folder on a phone, the list
# itself on a tablet — a Back there would rightly leave the app).
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    # The tab itself ("Music\nTab 2 of 4"), not the Music chip.
    text: "(?s).*Tab 2 of 4.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 84_on_music
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 85_back_from_music
