# The player audit's fixes on a real Android build, portrait
# (docs/player_ux_audit_2026_11.md). Runs after layout_portrait, which opens
# the lab film and leaves it playing upright:
#  - B2: ♪ and CC are on the portrait top bar;
#  - B1: ⋮ then Back closes the menu and the film stays;
#  - B3: holding Next opens the repeat menu (Loop one / Loop all);
#  - the subtitle panel opens from CC, and Back closes it, not the film.
# Each check has its screenshot (7x_audit_*).
appId: com.innocent.media
---
- runFlow:
    # Controls up: tap the picture only if they are not (a tap on shown
    # controls hides them).
    when:
      notVisible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      - waitForAnimationToEnd:
          timeout: 1000
- takeScreenshot: 70_audit_controls_portrait
- assertVisible: "(Audio track|အသံ လိုင်း)"
- assertVisible: "(Subtitle|စာတန်းထိုး)"

# ── B1: ⋮, then Back ───────────────────────────────────────────────────
- tapOn: "(More|နောက်ထပ်)"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 71_audit_more_portrait
- assertVisible: "(Video Display|ဗီဒီယိုပြသမှု)"
- back
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 72_audit_more_closed_by_back
- assertNotVisible: "(Video Display|ဗီဒီယိုပြသမှု)"
# Still in the player: its controls come back on a tap.
- runFlow:
    # Controls up: tap the picture only if they are not (a tap on shown
    # controls hides them).
    when:
      notVisible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible: "(Audio track|အသံ လိုင်း)"

# ── B3: hold Next ──────────────────────────────────────────────────────
- longPressOn: "(Next video.*|နောက် ဗီဒီယို.*)"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 73_audit_repeat_menu
- assertVisible: "(Loop one|တစ်ခု ထပ်ဖွင့်)"
- back
- waitForAnimationToEnd:
    timeout: 1000

# ── CC: the subtitle panel, closed by Back ─────────────────────────────
- runFlow:
    # Controls up: tap the picture only if they are not (a tap on shown
    # controls hides them).
    when:
      notVisible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      - waitForAnimationToEnd:
          timeout: 1000
- tapOn: "(Subtitle|စာတန်းထိုး)"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 74_audit_subtitle_panel
- back
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 75_audit_subtitle_panel_closed
- runFlow:
    # Controls up: tap the picture only if they are not (a tap on shown
    # controls hides them).
    when:
      notVisible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible: "(Audio track|အသံ လိုင်း)"
