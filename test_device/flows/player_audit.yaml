# The player audit's fixes on a real Android build, portrait
# (docs/player_ux_audit_2026_11.md). Runs after layout_portrait, which opens
# the lab film and leaves it playing upright:
#  - B2: ♪ and CC are on the portrait top bar;
#  - B1: ⋮ then Back closes the menu and the film stays;
#  - B3: holding Next opens the repeat menu (Loop one / Loop all);
#  - the subtitle panel opens from CC, and Back closes it, not the film.
# The controls hide 4 s after a tap and Maestro takes about a second a
# step (run 42991222224 lost them between two asserts), so before each
# action the controls are shown afresh — hidden first if up — and used at
# once. Each check has its screenshot (7x_audit_*).
appId: com.innocent.media
---
# ── B2: audio and subtitles on the top bar ───────────────────────────────
- runFlow:
    # Fresh controls: hidden first if they are up, then shown, so the next
    # step has the whole 4 s.
    when:
      visible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      # Apart from the next tap, or the two make a double tap: play/pause,
      # and the controls stay down (run 42993934736's last check).
      - waitForAnimationToEnd:
          timeout: 800
- tapOn:
    point: "50%,50%"
- takeScreenshot: 70_audit_controls_portrait
- assertVisible: "(Audio track|အသံ လိုင်း)"
- runFlow:
    # Fresh controls: hidden first if they are up, then shown, so the next
    # step has the whole 4 s.
    when:
      visible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      # Apart from the next tap, or the two make a double tap: play/pause,
      # and the controls stay down (run 42993934736's last check).
      - waitForAnimationToEnd:
          timeout: 800
- tapOn:
    point: "50%,50%"
- assertVisible: "(Subtitle|စာတန်းထိုး)"

# ── B1: ⋮, then Back ─────────────────────────────────────────────────────
- runFlow:
    # Fresh controls: hidden first if they are up, then shown, so the next
    # step has the whole 4 s.
    when:
      visible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      # Apart from the next tap, or the two make a double tap: play/pause,
      # and the controls stay down (run 42993934736's last check).
      - waitForAnimationToEnd:
          timeout: 800
- tapOn:
    point: "50%,50%"
- tapOn: "(More|နောက်ထပ်)"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 71_audit_more_portrait
# The controls step aside while the menu is open (12 Nov): one layer
# at a time, nothing showing through it.
- assertVisible: "(Video Display|ဗီဒီယိုပြသမှု).*"
- back
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 72_audit_more_closed_by_back
- assertNotVisible: "(Video Display|ဗီဒီယိုပြသမှု).*"
# Still in the player: a tap brings its controls back.
- runFlow:
    # Fresh controls: hidden first if they are up, then shown, so the next
    # step has the whole 4 s.
    when:
      visible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      # Apart from the next tap, or the two make a double tap: play/pause,
      # and the controls stay down (run 42993934736's last check).
      - waitForAnimationToEnd:
          timeout: 800
- tapOn:
    point: "50%,50%"
- assertVisible: "(Audio track|အသံ လိုင်း)"

# ── B3: hold Next ────────────────────────────────────────────────────────
- runFlow:
    # Fresh controls: hidden first if they are up, then shown, so the next
    # step has the whole 4 s.
    when:
      visible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      # Apart from the next tap, or the two make a double tap: play/pause,
      # and the controls stay down (run 42993934736's last check).
      - waitForAnimationToEnd:
          timeout: 800
- tapOn:
    point: "50%,50%"
- longPressOn: "(Next video|နောက် ဗီဒီယို).*"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 73_audit_repeat_menu
- assertVisible: "(Loop one|တစ်ခု ထပ်ဖွင့်)"
- back
- waitForAnimationToEnd:
    timeout: 1000

# ── CC: the subtitle panel, closed by Back ───────────────────────────────
- runFlow:
    # Fresh controls: hidden first if they are up, then shown, so the next
    # step has the whole 4 s.
    when:
      visible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      # Apart from the next tap, or the two make a double tap: play/pause,
      # and the controls stay down (run 42993934736's last check).
      - waitForAnimationToEnd:
          timeout: 800
- tapOn:
    point: "50%,50%"
- tapOn: "(Subtitle|စာတန်းထိုး)"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 74_audit_subtitle_panel
- assertVisible: "(Online.*|.*Online.*)"
- back
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 75_audit_subtitle_panel_closed
- assertNotVisible: "(Online.*|.*Online.*)"
- runFlow:
    # Fresh controls: hidden first if they are up, then shown, so the next
    # step has the whole 4 s.
    when:
      visible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      # Apart from the next tap, or the two make a double tap: play/pause,
      # and the controls stay down (run 42993934736's last check).
      - waitForAnimationToEnd:
          timeout: 800
- tapOn:
    point: "50%,50%"
- assertVisible: "(Audio track|အသံ လိုင်း)"
