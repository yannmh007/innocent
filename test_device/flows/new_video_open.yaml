# The Video tab, open and left alone — the first half of the `newvideo` flow
# (run.sh). run.sh then copies a video onto the phone and watches the screen
# for it to appear, with nobody pulling to refresh.
appId: com.innocent.media
---
- launchApp
- waitForAnimationToEnd:
    timeout: 10000
# A fresh install opens on the introduction; skip it, then grant access.
- tapOn:
    text: "Skip"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
- tapOn:
    text: "Video"
    optional: true
- extendedWaitUntil:
    visible: "__nothing_has_this_text__"
    timeout: 8000
    optional: true
- takeScreenshot: 90_newvideo_before
