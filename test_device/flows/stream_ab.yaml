# One catalogue film streamed from the real Worker, from a fresh install, for
# 75 seconds. run.sh plays this twice — stream_lanes1 and stream_lanes3 — on
# the same shaped, lossy line, with the proxy on one connection and then on
# three; the trail ("stream lanes=", "stream stretch", "rebuffer") is the
# comparison. "Unknow" is free, 18 minutes, a 1280-line original with a ladder.
appId: com.innocent.media
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "Movies"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    text: "I am 18 or older.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "(?s).*Unknow.*"
    direction: DOWN
    timeout: 30000
    optional: true
- tapOn:
    text: "(?s).*Unknow.*"
    index: 0
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot: 70_ab_detail
# The video's tile carries its running time.
- scrollUntilVisible:
    element:
      text: "18:29"
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    text: "18:29"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "50%,50%"
    optional: true
- tapOn:
    text: "Got it"
    optional: true
# A playing film never stops animating: each wait runs its full timeout.
- waitForAnimationToEnd:
    timeout: 25000
- takeScreenshot: 71_ab_25s
- waitForAnimationToEnd:
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 25000
- takeScreenshot: 72_ab_75s
- back
- waitForAnimationToEnd:
    timeout: 3000
