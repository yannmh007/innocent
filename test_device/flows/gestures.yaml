# MX gestures in the player, portrait: seek, volume and brightness swipes,
# stacked double taps, long press for speed, tap for the controls. Each one's
# result is in lab_trace.txt ("LAB gesture ..."), from the lab build's trace
# in GestureOverlay; the screenshots show the indicator just after it.
# Two-finger gestures (speed, pinch, pan) and the subtitle's are not in
# Maestro's reach: test/player_gesture_engine_test.dart covers them.
appId: com.innocent.media
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 10000
# A fresh install opens on the introduction (when this flow runs first):
# skip it, then grant access, as perf_idle does.
- tapOn:
    text: "Skip"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
- tapOn:
    text: "Video"
    optional: true
- extendedWaitUntil:
    visible: ".*Perf Test.*"
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      text: ".*Perf Test.*"
    direction: DOWN
    optional: true
- tapOn:
    text: ".*Perf Test.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: ".*aaa_play_720p.*"
    optional: true
- extendedWaitUntil:
    visible: "__nothing_has_this_text__"
    timeout: 6000
    optional: true
# Seek: a slow drag across the middle (the lab trace logs the seconds).
- swipe:
    start: "30%,50%"
    end: "70%,50%"
    duration: 900
- takeScreenshot: 90_seek_port
- extendedWaitUntil:
    visible: "__nothing_has_this_text__"
    timeout: 1500
    optional: true
# Volume: up on the right half.
- swipe:
    start: "80%,62%"
    end: "80%,38%"
    duration: 900
- takeScreenshot: 91_volume_port
- extendedWaitUntil:
    visible: "__nothing_has_this_text__"
    timeout: 1500
    optional: true
# Brightness: up on the left half.
- swipe:
    start: "20%,62%"
    end: "20%,38%"
    duration: 900
- takeScreenshot: 92_brightness_port
- extendedWaitUntil:
    visible: "__nothing_has_this_text__"
    timeout: 1500
    optional: true
# Double tap on the right, then two more taps: the seek stacks.
- doubleTapOn:
    point: "85%,50%"
- tapOn:
    point: "85%,50%"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- tapOn:
    point: "85%,50%"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- takeScreenshot: 93_double_tap_right_port
- extendedWaitUntil:
    visible: "__nothing_has_this_text__"
    timeout: 1500
    optional: true
# Double tap on the left: back.
- doubleTapOn:
    point: "15%,50%"
- takeScreenshot: 94_double_tap_left_port
- extendedWaitUntil:
    visible: "__nothing_has_this_text__"
    timeout: 1500
    optional: true
# Long press: the speed slider.
- longPressOn:
    point: "50%,45%"
- takeScreenshot: 95_long_press_port
- extendedWaitUntil:
    visible: "__nothing_has_this_text__"
    timeout: 2500
    optional: true
# One tap: the controls.
- tapOn:
    point: "50%,45%"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 96_tap_controls_port
