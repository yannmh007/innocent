# ADB is the app's own engine only (1.64.59): the separately installed iADB
# app is no longer used. The embedded engine still builds its key and
# certificate (libadb-android, BouncyCastle, the hidden-API exemption), and
# the ADB screen offers no backend choice — no "iADB" anywhere on it — and
# opens on a checklist of the setup steps, read live from Settings.
appId: com.innocent.media
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "(?s).*Tab 4 of 4.*"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "(?s)Settings\\n.*"
    direction: DOWN
- tapOn: "(?s)Settings\\n.*"
- waitForAnimationToEnd:
    timeout: 3000
# The ADB tiles live under Settings → List.
- tapOn: "List"
- waitForAnimationToEnd:
    timeout: 3000
# The engine self-test row went with the dead settings (15 Oct); the key and
# certificate it built are checked on the JVM now, with the app's
# BouncyCastle (tool/netlab/src/test/kotlin/AdbIdentityTest.kt).
# The connection screen: pairing and connect, no backend selector.
- scrollUntilVisible:
    element:
      text: "(?s).*Android/data access.*"
    direction: DOWN
- tapOn: "(?s).*Android/data access.*"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 96_adb_screen
# The live setup checklist: what Settings says is done, ticked as it changes.
- assertVisible: "(?s).*Setup — where you are.*"
- assertVisible: "(?s).*Developer options on.*"
- assertVisible: "(?s).*Wireless debugging on.*"
- assertVisible: "(?s).*Connected.*"
- assertNotVisible: "(?s).*iADB.*"
- assertNotVisible: "(?s).*How Innocent reads Android/data.*"
- scrollUntilVisible:
    element:
      text: "(?s).*Open.*"
    direction: DOWN
    optional: true
- takeScreenshot: 97_adb_screen_end
