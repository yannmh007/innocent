# Download the whole album, answering the size question if it is asked.
appId: com.innocent.media
---
- scrollUntilVisible:
    element:
      text: "Download all"
    direction: UP
    optional: true
- tapOn:
    text: "Download all"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 30_download_tapped
- tapOn:
    text: "Download"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 31_download_15s
