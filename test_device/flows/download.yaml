# Save the title for offline, then watch the Downloads screen while it runs.
appId: com.innocent.media
---
- tapOn:
    text: "Save for offline"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 30_download_tapped
- tapOn:
    text: "Download.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 31_download_confirm
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: 32_download_20s
