# The Transfer tab, redesigned (MX's front door): SEND / RECEIVE, Turbo on
# by default, Share with PC / iPhone / Tablet, History. On the emulator there
# is no Wi-Fi Direct, so a Turbo start must FALL BACK to the emulator's Wi-Fi
# by itself and still serve — which is the path every phone without Turbo
# takes, and the one this checks end to end on a real Android.
appId: com.innocent.media
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn: "Transfer"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 30_transfer_home
- assertVisible: "SEND"
- assertVisible: "RECEIVE"
- assertVisible: "Share with"
- assertVisible: "On — phone to phone.*"
# Receive: the scan card leads.
- tapOn: "RECEIVE"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 31_transfer_receive
- assertVisible: "Scan the sender.*"
- back
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "SEND"
# Share with a computer: starts with no files; Turbo tries, falls back.
- tapOn: "Share with"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 32_transfer_pc
- tapOn: "Start"
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- extendedWaitUntil:
    visible: "Stop sharing"
    timeout: 70000
- takeScreenshot: 33_transfer_pc_live
- assertVisible: "http://.*"
- tapOn: "Stop sharing"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 34_transfer_pc_stopped
- back
- waitForAnimationToEnd:
    timeout: 3000
# Settings: the switches that used to crowd the Send page.
- tapOn:
    text: "Transfer settings"
    optional: true
- takeScreenshot: 35_transfer_settings
- back
# Send opens the picker straight away; backing out returns home.
- tapOn: "SEND"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 36_transfer_send_picker
- back
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 37_transfer_back_home
- assertVisible: "RECEIVE"
