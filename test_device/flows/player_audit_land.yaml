# The player audit's fixes on a real Android build, landscape
# (docs/player_ux_audit_2026_11.md). Runs after layout_landscape, with the
# lab film open and the phone turned (run.sh turns it for layout_landscape):
#  - B2: ♪ and CC are on the landscape top bar;
#  - B1: ⋮ then Back closes the menu and the film stays;
#  - B3: holding Next opens the repeat menu (Loop one / Loop all);
#  - the subtitle panel opens from CC, and Back closes it, not the film.
# The controls hide 4 s after a tap and Maestro takes about a second a
# step (run 42991222224 lost them between two asserts), so before each
# action the controls are shown afresh — hidden first if up — and used at
# once. Each check has its screenshot (8x_audit_*).
appId: com.innocent.media
---
# ── B2: audio and subtitles on the top bar ───────────────────────────────
- runFlow:
    # Fresh controls: hidden first if they are up, then shown, so the next
    # step has the whole 4 s.
    when:
      visible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      # Apart from the next tap, or the two make a double tap: play/pause,
      # and the controls stay down (run 42993934736's last check). A real
      # pause: waitForAnimationToEnd returns at once on a still screen
      # (run 43176762134), so this waits for a text that never comes.
      - extendedWaitUntil:
          visible: "__no_such_text__"
          timeout: 900
          optional: true
- tapOn:
    point: "50%,50%"
- takeScreenshot: 80_audit_controls_landscape
- assertVisible: "(Audio track|အသံ လိုင်း)"
- runFlow:
    # Fresh controls: hidden first if they are up, then shown, so the next
    # step has the whole 4 s.
    when:
      visible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      # Apart from the next tap, or the two make a double tap: play/pause,
      # and the controls stay down (run 42993934736's last check). A real
      # pause: waitForAnimationToEnd returns at once on a still screen
      # (run 43176762134), so this waits for a text that never comes.
      - extendedWaitUntil:
          visible: "__no_such_text__"
          timeout: 900
          optional: true
- tapOn:
    point: "50%,50%"
- assertVisible: "(Subtitle|စာတန်းထိုး)"

# ── B1: ⋮, then Back ─────────────────────────────────────────────────────
- runFlow:
    # Fresh controls: hidden first if they are up, then shown, so the next
    # step has the whole 4 s.
    when:
      visible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      # Apart from the next tap, or the two make a double tap: play/pause,
      # and the controls stay down (run 42993934736's last check). A real
      # pause: waitForAnimationToEnd returns at once on a still screen
      # (run 43176762134), so this waits for a text that never comes.
      - extendedWaitUntil:
          visible: "__no_such_text__"
          timeout: 900
          optional: true
- tapOn:
    point: "50%,50%"
- tapOn: "(More|နောက်ထပ်)"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 81_audit_more_landscape
# The controls step aside while the menu is open (12 Nov): one layer
# at a time, nothing showing through it.
- assertVisible: "(Playing Queue|ဖွင့်နေသော.*)"
- back
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 82_audit_more_closed_by_back
- assertNotVisible: "(Playing Queue|ဖွင့်နေသော.*)"
# Still in the player: a tap brings its controls back.
- runFlow:
    # Fresh controls: hidden first if they are up, then shown, so the next
    # step has the whole 4 s.
    when:
      visible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      # Apart from the next tap, or the two make a double tap: play/pause,
      # and the controls stay down (run 42993934736's last check). A real
      # pause: waitForAnimationToEnd returns at once on a still screen
      # (run 43176762134), so this waits for a text that never comes.
      - extendedWaitUntil:
          visible: "__no_such_text__"
          timeout: 900
          optional: true
- tapOn:
    point: "50%,50%"
- assertVisible: "(Audio track|အသံ လိုင်း)"

# ── B3: hold Next ────────────────────────────────────────────────────────
- runFlow:
    # Fresh controls: hidden first if they are up, then shown, so the next
    # step has the whole 4 s.
    when:
      visible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      # Apart from the next tap, or the two make a double tap: play/pause,
      # and the controls stay down (run 42993934736's last check). A real
      # pause: waitForAnimationToEnd returns at once on a still screen
      # (run 43176762134), so this waits for a text that never comes.
      - extendedWaitUntil:
          visible: "__no_such_text__"
          timeout: 900
          optional: true
- tapOn:
    point: "50%,50%"
- longPressOn: "(Next video|နောက် ဗီဒီယို).*"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 83_audit_repeat_menu
- assertVisible: "(Loop one|တစ်ခု ထပ်ဖွင့်)"
- back
- waitForAnimationToEnd:
    timeout: 1000

# ── CC: the subtitle panel, closed by Back ───────────────────────────────
- runFlow:
    # Fresh controls: hidden first if they are up, then shown, so the next
    # step has the whole 4 s.
    when:
      visible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
      # Apart from the next tap, or the two make a double tap: play/pause,
      # and the controls stay down (run 42993934736's last check). A real
      # pause: waitForAnimationToEnd returns at once on a still screen
      # (run 43176762134), so this waits for a text that never comes.
      - extendedWaitUntil:
          visible: "__no_such_text__"
          timeout: 900
          optional: true
- tapOn:
    point: "50%,50%"
- tapOn: "(Subtitle|စာတန်းထိုး)"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 84_audit_subtitle_panel
- assertVisible: "(Online.*|.*Online.*)"
- back
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 85_audit_subtitle_panel_closed
- assertNotVisible: "(Online.*|.*Online.*)"
# Still in the player. One tap only if the controls are down: two taps a
# moment apart are a double tap (run 43154335111's last check paused the
# film instead).
- runFlow:
    when:
      notVisible: "(Audio track|အသံ လိုင်း)"
    commands:
      - tapOn:
          point: "50%,50%"
- assertVisible: "(Audio track|အသံ လိုင်း)"
