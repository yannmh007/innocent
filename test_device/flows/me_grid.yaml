# Me: the grid in the owner's order (Download, File Transfer, Private Folder /
# Movies, Media Manager, Local Network / Network Stream, Video Playlists,
# Recycle Bin) — every tile opens; Movies reaches the hub; Cloud Drive now
# lives in Backup & Restore.
appId: com.innocent.media
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Skip"
    optional: true
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "Allow.*"
    optional: true
- tapOn:
    text: "(?s).*Tab 4 of 4.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 80_me_grid
- assertNotVisible: "(?s).*Cloud Drive.*"
- assertVisible: "(?s).*Movies.*"
- assertVisible: "(?s).*Recycle bin.*"
# Movies: the hub (its age gate on a fresh install).
- tapOn: "(?s).*Movies.*"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 81_me_movies
- assertNotVisible: "(?s).*Tab 4 of 4.*"
- back
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible: "(?s).*Recycle bin.*"
# Each of the other tiles opens and comes back.
- tapOn: "(?s).*Media Manager.*"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 82_me_media_manager
- back
- tapOn: "(?s).*Network Stream.*"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 83_me_network_stream
- back
- tapOn: "(?s).*Video Playlists.*"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 84_me_playlists
- back
- tapOn: "(?s).*Recycle bin.*"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 85_me_recycle
- back
- tapOn: "(?s).*Downloads.*"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 86_me_downloads
- back
- waitForAnimationToEnd:
    timeout: 3000
# Backup & Restore: Cloud Drive is in it, and opens.
- scrollUntilVisible:
    element:
      text: "(?s).*Backup & Restore.*"
    direction: DOWN
- tapOn: "(?s).*Backup & Restore.*"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 87_backup
- scrollUntilVisible:
    element:
      text: "(?s).*Cloud Drive.*"
    direction: DOWN
- tapOn: "(?s).*Cloud Drive.*"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 88_cloud_drive
- back
- back
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "(?s).*Recycle bin.*"
