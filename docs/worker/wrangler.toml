# innocent-stream — the only public door to the private video bucket.
#
# Deploy with:  npx wrangler deploy
# See README.md in this folder for the four steps around it.

name = "innocent-stream"
main = "src/index.js"

# Recent enough for the runtime APIs this Worker uses. Do not lower it.
compatibility_date = "2026-07-06"

# The private bucket, bound directly. No S3 endpoint, no signature, no
# credentials in the Worker: a binding is an internal handle that only this
# Worker's code can use.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "innocent-media"

# ── caching is OFF, and that is a decision rather than an omission ───────
#
# This Worker was first written around Workers Caching, with a second,
# cached entrypoint keyed on the object key so two viewers of one film would
# share an edge copy. The reasoning was right and the shape was wrong, for a
# reason that is in Cloudflare's own documentation: cacheable responses are
# capped at 512 MB, and every Workers Caching response is held to the Free
# plan's limit at launch whatever the account's plan. A feature film does
# not fit. The benefit was never available for this content; the cost — a
# cold cache trying to pull a whole object before anyone receives a byte —
# was paid on every first play.
#
# So it is off. The Worker reads from the R2 binding and answers `Range`
# itself. Turning this back on without also solving the size limit would
# reintroduce a video that buffers and never starts.
[cache]
enabled = false

# TOKEN_SECRET is NOT set here. It is a secret, it is shared with the
# Supabase function that mints tokens, and a repository is a public place:
#
#   npx wrangler secret put TOKEN_SECRET
