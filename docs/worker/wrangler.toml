# innocent-stream — the only public door to the private video bucket.
#
# Deploy with:  npx wrangler deploy
# See README.md in this folder for the four steps around it.

name = "innocent-stream"
main = "src/index.js"

# Recent enough for the runtime APIs this Worker uses. Do not lower it.
compatibility_date = "2026-07-06"

# The private bucket, bound directly. No S3 endpoint, no signature, no
# credentials in the Worker: a binding is an internal handle that only this
# Worker's code can use.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "innocent-media"

# ── caching is OFF, and that is a decision rather than an omission ───────
#
# This Worker was first written around Workers Caching, with a second,
# cached entrypoint keyed on the object key so two viewers of one film would
# share an edge copy. The reasoning was right and the shape was wrong, for a
# reason that is in Cloudflare's own documentation: cacheable responses are
# capped at 512 MB, and every Workers Caching response is held to the Free
# plan's limit at launch whatever the account's plan. A feature film does
# not fit. The benefit was never available for this content; the cost — a
# cold cache trying to pull a whole object before anyone receives a byte —
# was paid on every first play.
#
# So it is off. The Worker reads from the R2 binding and answers `Range`
# itself. Turning this back on without also solving the size limit would
# reintroduce a video that buffers and never starts.
[cache]
enabled = false

# ── edge fan-out: the cache in front of ONE entrypoint, not the Worker ────
#
# The two facts above are solved by shape, not by a bigger plan. The gateway
# (the default export) stays uncached: it runs on every request and opens the
# token. It asks a second entrypoint, `Block`, for fixed-size BLOCKS of the
# film at a path built from the object key and the block number — the same
# path for every viewer and every token, and each block far under the 512 MB
# ceiling. Workers Caching sits in front of `Block` only: it strips the
# player's Range, keeps the whole block, and cuts every later range out of
# it, from the data centre beside the viewer, with an upper tier behind that
# and one bucket read for any number of lanes asking at once. See
# serveFromBlocks / blockResponse in src/index.js.
#
# Requires Wrangler 4.107.0+ (the per-entrypoint map), pinned in package.json.
[exports.Block]
type = "worker"

  [exports.Block.cache]
  enabled = true

# The block size. Here, in [vars], and NOT in the dashboard: `wrangler deploy`
# replaces a Worker's plaintext variables with the ones in this file, so a
# value typed into the dashboard silently disappears on the next deploy.
# Not a secret — it is a number. "4194304" (4 MB) turns fan-out on: the cache
# answers a whole block and the gateway cuts the player's range out of it.
#
# "0" — OFF, since 2026-10-22, and that is a decision about the bill. With
# Workers Caching on, every `Block` call is billed as a request of its own,
# hit or miss: a 2 MB part costs the gateway plus one or two blocks, about
# 2.5 requests where the direct path costs one. On the Free plan's 100,000
# requests a day that is the difference between ~30 and ~75 whole films a
# day once 1.64.70's proxy is out (docs/security_streaming.md §5). What it
# saved — R2 reads, Class B — is free while the Worker is on the Free plan:
# 100,000 requests a day cannot pass Class B's 10 million a month. On Paid
# at scale it is not: buy the domain then, and the Cache API does fan-out's
# job without the extra billed call (phase 2).
[vars]
EDGE_BLOCK_BYTES = "0"

# Whose phone a token was granted to, and a loose ceiling on requests (see
# bindCheck and overLimit in src/index.js). "log" says what WOULD be refused,
# in the log and in `X-Bind`, and refuses nothing. "enforce" refuses. Each is
# switched to "enforce" only after the log shows the phones in the field
# passing — bind once 1.64.70 sends its install id with every fetch.
#
# BIND: ENFORCED 2026-10-25. Workers Logs, the last three days: 3,744
# fetches of bound tokens said "ok", and every one came from the app. Two
# said "missing": both asked for bytes 0-4095 with a Windows desktop
# browser's User-Agent, which no build of the app sends. They used a token
# granted to the owner's own phone, from somewhere that was not the app.
# That is the case this check exists to refuse. Older apps (before 1.64.70)
# do not ask for bound tokens, so they are not affected.
BIND_MODE = "enforce"
LIMIT_MODE = "log"

# The ceiling, per install (else per account, else per link), per data
# centre: 600 requests in 10 seconds. Set for the phones already out there:
# 1.64.69's proxy makes ~7.7 requests a megabyte, so a 50 Mbit/s Wi-Fi line
# filling its buffer is ~460 in 10 s. 1.64.70's makes under one a megabyte;
# once it is most of the field this can come down to ~200. The binding costs
# nothing (Wrangler 4.36+; pinned at 4.107+ in package.json).
[[ratelimits]]
name = "STREAM_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 600
  period = 10

# TOKEN_SECRET is NOT set here. It is a secret, it is shared with the
# Supabase function that mints tokens, and a repository is a public place:
#
#   npx wrangler secret put TOKEN_SECRET

# ── logs stay on, because a dashboard toggle does not survive a deploy ───
#
# Workers Logs was switched on in the dashboard and was OFF again the next
# time anyone looked — the Overview read "Workers Logs: Disabled" while the
# very deploy that was supposed to be traced ran. A setting made by hand in
# the dashboard is not part of the deploy, and a deploy that does not carry
# it can take it away.
#
# So it is declared here, where it is redeployed with the code. The evidence
# this Worker logs — one line per request saying what range was asked for and
# what was returned — is the only way to tell one slow stream from fifty fast
# ones, and those have opposite fixes.
#
# `head_sampling_rate = 1` means every request, not a sample. This is a
# handful of viewers; a sample of a handful is noise.
[observability]
enabled = true
head_sampling_rate = 1
